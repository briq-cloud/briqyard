openapi: 3.1.0
info:
  title: briqyard
  version: v0
  description: |
    Machines in Firecracker microVMs: on one host (briqyardd, port 7420) or across hosts
    (briqyard-fleet, port 7430, the same routes plus /v1/hosts). The API is not stable yet.

    Authentication: `Authorization: Bearer <token>` when the server has a token configured.
    Every response carries `x-request-id`; error bodies repeat it as `request_id`.
servers:
  - url: http://127.0.0.1:7420
    description: a daemon
  - url: http://127.0.0.1:7430
    description: a fleet
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200": { description: ok }
  /v1/status:
    get:
      summary: "The host's capacity and use; through the fleet, the ready hosts' and each region's room (ADR 0042)"
      responses:
        "200":
          description: status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /v1/machines:
    get:
      summary: "List machines, a namespace's or every one; through the fleet, the namespace's host or every host, never partial (ADR 0006)"
      parameters:
        - { name: namespace, in: query, schema: { type: string } }
        - { name: label, in: query, style: form, explode: true, schema: { type: array, items: { type: string } }, description: "repeatable, every one ANDed (ADR 0025): `key=value` (the machine's `metadata` has it) or `key` (has the key); a key is an optional DNS prefix and `/`, then at most 63 of a-z, A-Z, 0-9, `-_.`, alphanumeric at both ends; a value empty or the same. `!=`, `!key`, `in` and `notin` are refused" }
      responses:
        "200":
          description: machines
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Machine" } }
        "400": { description: "`invalid`: a label selector that is not `key=value` or `key`" }
    post:
      summary: "Create a machine (ADR 0048): answers once it is recorded, in `creating`, its name, address and (unless `start` is false) memory taken. Its image is pulled when the host has not seen it, its disks made and it is started in the background; `/wait` waits for that. A failure leaves it in `error` with `error_reason` (`pull_failed`, `create_failed`, `boot_failed`), for a read and a destroy; nothing is tried again"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMachineRequest" }
      responses:
        "201":
          description: recorded, in `creating`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "400": { description: "`invalid`: a bad field, named; a fork's or a restore's `volume` smaller than its source's (`a volume never shrinks`; a larger one grows the disk, ADR 0040); a fork's source without disks (creating, or its create failed); through the fleet, a `region` other than the namespace's (its host's: a namespace never spans regions), or a fork into a namespace pinned to another host than its source's (a fork is made on its source's host, ADR 0056)" }
        "403": { description: "`quota`: past a limit of the namespace's quota, the limit and the use in `error`; nothing made" }
        "409": { description: "`conflict`: a machine with that name exists in the namespace, the body's `machine` is it: a create sent again after no answer finds the one it made" }
        "503": { description: "`capacity`: the host has no room (its memory, or for a volume its pool's free space); through the fleet, no host (of `region`, when given) has room" }
  /v1/sandbox-requests/lookup:
    post:
      summary: "Daemon-only authenticated read of an accepted sandbox create; no reservation, source lookup or worker"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SandboxRequestLookup" }
      responses:
        "200":
          description: accepted destination, including creating/error states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "404": { description: "sandbox_request_unknown: authoritative absence only; an existing fleet dispatch intent still cannot be sent again" }
        "409": { description: "conflict: changed digest, consumed destination unavailable or inconsistent durable index" }
  /v1/machines/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    description: "A namespace's gateway answers GET, `/logs`, `/stats` and `/wait` here like any machine; every other route on its id answers 409 `gateway` (`/v1/namespaces/{id}/gateway` owns it)."
    get:
      summary: A machine
      responses:
        "200": { description: machine, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Change the sleep window, the metadata, the egress policy, the limits or the probes, in any state; a running machine's policy and limits change at once, and its probes start over as at a boot. The image, entrypoint, command, env, files, size, ports and restart policy change at the next start (ADR 0024), `pending` until then, a running machine running on unchanged; `/restart` applies them now. A larger `volume` grows its disk at once and its filesystem at the next start, `pending` until then (ADR 0040). A change is an event (`egress_changed` for the policy or the limits, else `updated`, with `pending` for what waits for the next start) and moves `version`; a request that changes nothing does neither
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMachineRequest" }
      responses:
        "200": { description: machine, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "400": { description: "`invalid`: a bad sleep window, an `egress` the machine cannot take, bad `limits` or `probes` (the field named), a spec field a create would refuse (same message), a `volume` smaller than the machine's (`a volume never shrinks`) or on a machine without one, or an `If-Match` that is not a number" }
        "403": { description: "`quota`: a volume's growth would pass the namespace's `disk_gb`; nothing changed, a `quota_exceeded` event about it" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Moved" }
        "503": { description: "`capacity`: the pool has less free than a volume's growth" }
    delete:
      summary: Destroy a machine, its endpoints and its disks
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "204": { description: destroyed (or already gone) }
        "409": { $ref: "#/components/responses/Moved" }
  /v1/machines/{id}/start:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: "Boot a created or stopped machine; a `creating` one is started by its create once made, its memory taken now, and answered as it is"
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { description: machine, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "400": { description: "`invalid`: its `egress.via` names a machine that is gone, or `gateway` in a namespace that has none" }
        "403": { description: "`quota`: its memory or vCPUs would pass the namespace's quota; not moved, a `quota_exceeded` event about it" }
        "409": { description: "`bad_state`: busy (starting, stopping or destroying), or in `error` from a create that made no disks (`pull_failed`, `create_failed`: destroy it and create again); `boot_failed`: the guest did not come up, the body's `machine` is it, in state `error`; or the namespace's gateway did not come up, the body's `machine` is this one, not moved, the gateway's reason in its `error`; `conflict`: `If-Match` names a version it moved past, the body's `machine` is it as it is" }
        "503": { description: "`capacity`: the host has no room" }
  /v1/machines/{id}/wake:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Start a machine that went to sleep (idle), that the host stopped, or whose process ended; one stopped on request stays stopped
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { description: machine, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "409": { description: "`not_running`: stopped on request; `bad_state`: busy or in error; `boot_failed`: the guest did not come up; `conflict`: a stale `If-Match`" }
  /v1/machines/{id}/stop:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Stop a machine (SIGTERM to its process, SIGKILL after the timeout); disks are kept. A client that hangs up does not cancel this, nor any transition.
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StopRequest" }
      responses:
        "200": { description: machine, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "409": { $ref: "#/components/responses/Moved" }
  /v1/machines/{id}/restart:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Stop the machine and start it again, applying what a PATCH left `pending` (ADR 0024); one that is not running is started. `If-Match` is checked by the stop
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { description: machine, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "409": { description: "`bad_state`: destroying; `boot_failed`: the new spec did not boot, or its image could not be pulled (the change still pending), the body's `machine` is it, in state `error`; `conflict`: a stale `If-Match`" }
        "503": { description: "`capacity`: the host has no room for its size; the change stays pending" }
  /v1/machines/{id}/move:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: "Put the machine in another namespace (ADR 0056). Alone in its namespace and the target new: the namespace is renamed (its quota with it), nothing restarts, the address stays. Into a namespace of the host (made when it does not exist): a running machine is stopped and started on that network with a new address, its disks and endpoints kept; the namespace it left stays until deleted. Through the fleet, into a namespace pinned to another host: refused before anything happens (`other_host`; moving across hosts is not supported yet). A `moved` event in each namespace"
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "200": { description: what the move did, content: { application/json: { schema: { $ref: "#/components/schemas/MoveResult" } } } }
        "400": { description: "`invalid`: not a namespace id; the machine's `egress` cannot be kept in the target (`via` a machine of another namespace, or the gateway of a namespace without one)" }
        "403": { description: "`quota`: the target namespace's quota" }
        "409": { description: "`bad_state`: creating, starting, stopping or destroying; `conflict`: the target has a machine of that name, another machine of the namespace sends its traffic through this one, a snapshot with memory would resume on the old address, or a stale `If-Match`; `gateway`: the machine is a namespace's gateway; `other_host`: through the fleet, the target namespace is on another host" }
        "503": { description: "`capacity`: no address left in the target, or the host has no room for it to start again" }
  /v1/machines/{id}/touch:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Record use, which postpones sleep
      responses:
        "204": { description: recorded }
  /v1/machines/{id}/wait:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: timeout, in: query, schema: { type: integer, default: 60, maximum: 600 }, description: seconds }
      - { name: for, in: query, schema: { type: string, enum: [ready, running], default: ready }, description: "`ready`: running and its probes say it serves (ADR 0022); `running`: its init answered" }
    post:
      summary: Wait until the machine is ready (or running, with `for=running`)
      responses:
        "200": { description: ready (or running), content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "400": { description: "`invalid`: `for` is not `ready` or `running`" }
        "409": { description: "`not_ready`: still on its way at the timeout (creating, starting, a restart waiting, running not ready), the body's `machine` is it with its `probes_status`: wait again; `pull_failed`, `create_failed`: its create failed (ADR 0048), the body's `machine` is it; `boot_failed` (`for=ready`): it is in `error`, its guest or its startup probe failed the boot, the body's `machine` is it; `not_running`: it will not run (stopped, destroying; `error` with `for=running`)" }
  /v1/machines/{id}/exec:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: "An exec session (ADR 0029): a WebSocket upgrade (`Connection: Upgrade`, `Upgrade: websocket`, the bearer token as for every route). Every message is binary, its first byte the channel: 0 stdin (to the server), 1 stdout, 2 stderr (empty with `tty`), 3 the end (`SessionEnd`, last), 4 a resize (`Resize`, to the server), 255 a close (payload `0`: stdin's end; nothing on a terminal, where ^D is a byte). The command starts before the `101`; closing the connection ends it (SIGKILL to its process group; on a terminal SIGHUP first, SIGKILL 5 s later). The machine is in use while the session is open: it does not go to sleep. A ping every 30 s; a client silent for 90 s is gone. A `session_opened` event. Through the fleet, relayed as bytes to the machine's host"
      parameters:
        - { name: cmd, in: query, required: true, schema: { type: array, items: { type: string } }, style: form, explode: true, description: "one per argument, in order" }
        - { name: env, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true, description: "`NAME=VALUE`, one per variable" }
        - { name: cwd, in: query, schema: { type: string } }
        - { name: timeout_ms, in: query, schema: { type: integer, default: 0, maximum: 3600000 }, description: "the command's deadline; 0 is none: it lasts as long as the session" }
        - { name: wake, in: query, schema: { type: boolean, default: true }, description: "wake a sleeping machine (and wait for it to be ready) before the command" }
        - { name: tty, in: query, schema: { type: boolean, default: false }, description: "a pseudo-terminal: one output, `TERM` from `env` (`xterm` when absent), the command its session leader" }
        - { name: cols, in: query, schema: { type: integer, default: 80, maximum: 65535 } }
        - { name: rows, in: query, schema: { type: integer, default: 24, maximum: 65535 } }
      responses:
        "101": { description: "the session; its messages as above" }
        "400": { description: "`invalid`: not an upgrade, no `cmd`, an unknown parameter or a value that does not parse" }
        "404": { description: "`not_found`" }
        "409": { description: "`not_running`: not running and `wake` was false, or the guest did not take the command; `boot_failed`: the wake did not boot" }
    post:
      summary: Run a command inside the machine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200": { description: output, content: { application/json: { schema: { $ref: "#/components/schemas/ExecResult" } } } }
        "409": { description: "`not_running`: not running (`wake` false, or stopped on request); or it went down during the command, which may have run" }
  /v1/machines/{id}/files:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: Read a file from a running machine
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: file, content: { application/json: { schema: { $ref: "#/components/schemas/FileResponse" } } } }
    put:
      summary: Write a file into a running machine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutFileRequest" }
      responses:
        "204": { description: written }
  /v1/machines/{id}/files/capabilities:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: Probe the running guest's current file capabilities
      description: "A fresh pong, never inferred from the init version or cached across calls. Choose the transfer path before consuming input. file_stream_v1=false permits bounded small JSON operations with legacy semantics; an image change installs the current init. An error is a failed probe, never permission to fall back."
      responses:
        "200":
          description: live guest support and protocol limits
          content:
            application/json:
              schema:
                type: object
                required: [file_stream_v1, init_version, legacy_max_bytes, native_max_bytes]
                properties:
                  file_stream_v1: { type: boolean }
                  init_version: { type: string }
                  legacy_max_bytes: { type: integer, enum: [1048576] }
                  native_max_bytes: { type: integer, enum: [1073741824] }
        "409": { description: machine not running or guest probe timed out }
  /v1/machines/{id}/files/content:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: path, in: query, required: true, schema: { type: string, maxLength: 4096 }, description: "absolute file path; no empty, . or .. components; symlinks in parent directories are refused" }
    get:
      summary: Stream a regular file from a running machine
      description: "Raw bytes, at most 1 GiB, with Content-Length. Symlinks and special files are refused. The machine stays in use for the transfer. A file that changes during the read is not a snapshot; truncation ends the response early. Requires a streaming-capable init (ADR 0061)."
      responses:
        "200":
          description: raw file bytes
          headers:
            Content-Length: { schema: { type: integer, minimum: 0, maximum: 1073741824 } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "400": { description: invalid path or file too large }
        "409": { description: machine not running, old init, or transfer limit reached }
    put:
      summary: Atomically replace a file in a running machine from raw bytes
      description: "Content-Length is optional; both declared and counted sizes are limited to 1 GiB. Missing parent directories are created. The final path is replaced, including a symlink or hard link itself; its target is never written. On cancellation or an incomplete body the destination is unchanged. Answers the committed size and guest-computed SHA-256. Transfer bounds: 16 per daemon, 4 per guest, 60 s idle, 900 s total. Requires a streaming-capable init (ADR 0061)."
      parameters:
        - { name: Content-Length, in: header, required: false, schema: { type: integer, minimum: 0, maximum: 1073741824 } }
        - { name: mode, in: query, schema: { type: string, pattern: "^0*[0-7]{1,3}$" }, description: "octal permission bits, 0000 through 0777; absent preserves an existing regular file mode, otherwise 0644" }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: complete file committed
          content:
            application/json:
              schema:
                type: object
                required: [size, sha256]
                properties:
                  size: { type: integer, minimum: 0, maximum: 1073741824 }
                  sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        "400": { description: invalid path, mode, size or body }
        "409": { description: machine not running, old init, or transfer limit reached }
  /v1/machines/{id}/logs:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: since, in: query, schema: { type: string }, description: "the `next` cursor of a previous page: an offset in the whole console, its rotated file included (ADR 0021); one rotated away reads on from the oldest line kept" }
      - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 5000 } }
      - { name: follow, in: query, schema: { type: boolean, default: false }, description: "keep it open (ADR 0025): the lines after `since`, then each new one, as NDJSON" }
    get:
      summary: "The serial console, paged. With `follow=true`, NDJSON kept open: one `LogLine` per line, across a rotation, `{}` every 30 s, and a last line `{code, error}` when it ends (`destroyed`: the machine was; `shutdown`: the daemon goes down, follow again from the `since` in `error`). Through the fleet a follow is streamed through"
      responses:
        "200":
          description: a page, or with `follow` a stream
          content:
            application/json: { schema: { $ref: "#/components/schemas/LogsResponse" } }
            application/x-ndjson: { schema: { $ref: "#/components/schemas/LogLine" } }
  /v1/machines/{id}/stats:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: CPU, memory and disk the machine uses now (CPU and memory on jailed hosts)
      responses:
        "200": { description: stats, content: { application/json: { schema: { $ref: "#/components/schemas/MachineStats" } } } }
  /v1/machines/{id}/backups:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: The backups of a machine id in the store, oldest first; the machine may be gone, the store is shared across hosts
      responses:
        "200": { description: backups, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Backup" } } } } }
    post:
      summary: "Send the machine's disks to the backup store (crash-consistent while it runs), after any backup of it under way: whole the first time and every `keep`-th, else what changed since the last; then, with a schedule, the backups that are neither among the newest `keep` nor a base of one go (ADR 0023). Its schedule's next time is `every` from now"
      responses:
        "201": { description: backup made, content: { application/json: { schema: { $ref: "#/components/schemas/Backup" } } } }
        "400": { description: backups are off on this host }
  /v1/machines/{id}/backups/{backup}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: backup, in: path, required: true, schema: { type: string } }
      - { name: chain, in: query, description: "also delete every backup that continues from it", schema: { type: boolean, default: false } }
      - { name: namespace, in: query, description: "through the fleet, for a machine destroyed: the hosts asked which holds its backups list only this namespace's (ADR 0045); without it, every backup they hold", schema: { type: string } }
    delete:
      summary: "Delete a backup of a machine of this host, or of one destroyed here (ADR 0023): its streams, then its record; a `backup_deleted` event"
      responses:
        "204": { description: deleted }
        "404": { description: "`not_found`: no such machine here, or no such backup of it" }
        "409": { description: "`conflict`: other backups continue from it, named in `error`; `?chain=true` deletes them too" }
  /v1/backups:
    get:
      summary: "Every backup of the host's machines, destroyed ones' included, by machine then age (ADR 0023); a destroyed machine's carry `deletes_at`. Through the fleet: every host, never partial, with `namespace` too (a host the namespace moved from holds the backups of what was destroyed there, ADR 0045)"
      parameters:
        - { name: namespace, in: query, schema: { type: string } }
        - { name: machine, in: query, description: "one machine's alone: none when it is neither on this host nor held here, without reading the store", schema: { type: string } }
      responses:
        "200": { description: backups, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Backup" } } } } }
        "400": { description: "`invalid`: backups are off on this host, or a bad namespace or machine id" }
  /v1/machines/{id}/snapshots:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: List its snapshots, oldest first (ADR 0031)
      responses:
        "200": { description: snapshots, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Snapshot" } } } } }
    post:
      summary: "Snapshot both disks at one instant, and the memory with `memory: true`; a `snapshot_taken` event"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapshotRequest" }
      responses:
        "201": { description: snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/Snapshot" } } } }
        "400": { description: "`invalid`: a bad name" }
        "409": { description: "`conflict`: the name is taken; `not_running`: memory asked of a machine with no process; `bad_state`: destroying, or a restore unfinished" }
  /v1/machines/{id}/snapshots/{snap}:
    parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/snap" }]
    delete:
      summary: "Delete a snapshot, from both disks and its memory; missing is success; a `snapshot_deleted` event. What a retired disk still clones goes with it"
      responses:
        "204": { description: deleted }
        "404": { description: no such machine }
        "409": { description: "`bad_state`: a restore unfinished" }
  /v1/machines/{id}/snapshots/{snap}/restore:
    parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/snap" }]
    post:
      summary: "Take the disks back to the snapshot, and the memory when it holds it and the spec is the same (ADR 0031): a running machine is stopped, then booted or resumed; any other stays as it is. Newer snapshots, forks and the backup chain are kept. A `restored` event"
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { description: machine, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "404": { description: "`not_found`: no such machine or snapshot" }
        "409": { description: "`bad_state`: starting, stopping or destroying; `boot_failed`: restored, then the guest did not come up; `conflict`: a stale `If-Match`" }
        "500": { description: "`internal`: the disks could not be swapped; the restore is finished by the next restore, start or daemon start" }
  /v1/machines/{id}/endpoints:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Open a port of the machine to the outside; a connection wakes a sleeping machine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEndpointRequest" }
      responses:
        "201": { description: endpoint, content: { application/json: { schema: { $ref: "#/components/schemas/Endpoint" } } } }
  /v1/endpoints:
    get:
      summary: List endpoints
      responses:
        "200": { description: endpoints, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Endpoint" } } } } }
  /v1/endpoints/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: An endpoint
      responses:
        "200": { description: endpoint, content: { application/json: { schema: { $ref: "#/components/schemas/Endpoint" } } } }
    delete:
      summary: Close an endpoint
      responses:
        "204": { description: closed }
  /v1/images:
    get:
      summary: Images built on the host, with how many machines clone each
      responses:
        "200": { description: images, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Image" } } } } }
  /v1/images/{key}:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    delete:
      summary: Remove an image no machine uses
      responses:
        "204": { description: removed }
        "409": { description: machines still use it }
  /v1/usage:
    get:
      summary: "What each machine used, per UTC hour (ADR 0017): measures, no price. The open hour's buckets grow until it closes; a closed bucket never changes; a destroyed machine's stay for `usage_keep_days`. The fleet asks every host and fails when one does not answer, as listings do, and sets `host` on each bucket"
      parameters:
        - { name: from, in: query, required: true, description: "the first hour, RFC 3339 (2026-10-20T14:00:00Z)", schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, description: "the hour after the last; at most 31 days after `from`", schema: { type: string, format: date-time } }
        - { name: namespace, in: query, schema: { type: string } }
      responses:
        "200": { description: "buckets, by hour then machine", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/UsageBucket" } } } } }
        "400": { description: "`invalid`: `from` or `to` missing, not RFC 3339, not on the hour, `to` not after `from`, or more than 31 days" }
  /v1/top:
    get:
      summary: "The running machines' use over the daemon's last two ticks, 15 s apart (ADR 0021): CPU, memory, disk, network rates, gateways included. Through the fleet: with `namespace`, from the namespace's host; without, every host, never partial, with `host` on each"
      parameters:
        - { name: namespace, in: query, schema: { type: string } }
      responses:
        "200": { description: "machines, by namespace then name", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TopMachine" } } } } }
  /v1/events:
    get:
      summary: "What happened on the host, oldest first (ADR 0019): the events after `since`. With `watch=true`, those and then each new event as it is logged, kept open as NDJSON, one event per line, `{\"bookmark\": <seq>}` after 30 s of quiet (`WatchBookmark`: the last seq the watch looked at, matching or not; not an event), and a last line `{code, error}` when the watch ends (`lagged`: it fell more than 1,024 events behind; `shutdown`: the daemon goes down); watch again from the later of the last `seq` and the last `bookmark` received. Repeats of `session_opened`, `quota_exceeded`, `ready` and `not_ready` within 10 minutes of their line are folded into one later line with `count` and `first_at` (ADR 0047). Through the fleet: with `namespace`, from the namespace's host, else with `machine`, from the machine's host (`x-briqyard-host` names it, the cursor is its seq, a watch is streamed through); with neither, every host, never partial, merged by time with `host` on each event and a cursor `<host>:<seq>,…`; a watch of every host is refused (400)"
      parameters:
        - { name: since, in: query, description: "a previous read's `next`; absent or 0, the oldest kept", schema: { type: string } }
        - { name: namespace, in: query, schema: { type: string } }
        - { name: machine, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [normal, warning] } }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 5000 } }
        - { name: watch, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: a page, or with `watch` a stream
          content:
            application/json: { schema: { $ref: "#/components/schemas/EventsPage" } }
            application/x-ndjson: { schema: { oneOf: [{ $ref: "#/components/schemas/Event" }, { $ref: "#/components/schemas/WatchBookmark" }, { $ref: "#/components/schemas/ApiError" }] } }
        "400": { description: "`invalid`: a `since` that is not a cursor, a bad id or type; a fleet-wide watch" }
        "404": { description: "`not_found` (fleet): the namespace or the machine is on no host; a destroyed machine's events are read with its namespace" }
        "410": { description: "`gone`: the events after `since` were removed, or `since` is past the host's last seq (its log began again); `oldest` is the oldest seq kept" }
  /v1/namespaces:
    get:
      summary: Namespaces on the host (daemon), or namespace to host (fleet)
      responses:
        "200": { description: namespaces, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Namespace" } } } } }
  /v1/namespaces/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: A namespace, its gateway included
      responses:
        "200": { description: namespace, content: { application/json: { schema: { $ref: "#/components/schemas/Namespace" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove the network of a namespace with no machine left, and its gateway
      responses:
        "204": { description: removed }
        "409": { description: "`namespace_in_use`: the namespace still has machines" }
  /v1/namespaces/{id}/gateway:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      parameters:
        - { name: region, in: query, schema: { type: string }, description: "fleet: where to place a namespace that has no host yet" }
      summary: "Make the namespace's gateway (the namespace too, when it has nothing yet), not started unless `start`, or replace its spec: a running one is restarted with it, on the same address, and the spec it has changes nothing (ADR 0016). It is a machine of the daemon named `gateway.internal` in the namespace, absent from `GET /v1/machines`; a machine with `egress: {mode: via, via: gateway}` starts it and waits for its port (its `ready` when it has a startup or readiness probe) before its own boot, and the daemon stops it when no such machine runs or starts"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GatewaySpec" }
      responses:
        "200": { description: the namespace, content: { application/json: { schema: { $ref: "#/components/schemas/Namespace" } } } }
        "400": { description: "`invalid`: no image, no port, a bad size, bad `probes`, or a change of `volume_gb`" }
        "403": { description: "`quota`: the gateway counts as one of the namespace's machines" }
        "409": { description: "`conflict`: a machine named `gateway` exists in the namespace; `boot_failed`: the gateway did not come up (asked with `start`, or replaced while running), the body's `machine` is it, in `error` with its console's last lines" }
    delete:
      summary: Stop and destroy the namespace's gateway; none is success
      responses:
        "204": { description: removed }
        "409": { description: "`gateway_in_use`: a machine of the namespace with `via: gateway` is running or starting" }
  /v1/namespaces/{id}/warm-pools:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: Host-local paused template pools and slot counts
      responses:
        "200": { description: pools, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WarmPool" } } } } }
  /v1/namespaces/{id}/warm-catalog:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: Operator catalog, host resource charges, measurements and blocked reasons
      responses:
        "200": { description: catalog status, content: { application/json: { schema: { $ref: "#/components/schemas/WarmCatalogStatus" } } } }
  /v1/namespaces/{id}/warm-catalog/{entry}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: entry, in: path, required: true, schema: { type: string } }
    put:
      summary: Set desired slots for one configured entry without changing operator ceilings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WarmDesiredRequest" } } }
      responses:
        "200": { description: desired pool state, content: { application/json: { schema: { $ref: "#/components/schemas/WarmPool" } } } }
        "400": { description: desired exceeds operator ceiling or invalid request }
        "404": { description: configured entry not found in namespace }
        "409": { description: unsupported or incompatible qualified template }
  /v1/namespaces/{id}/warm-pools/{name}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      summary: Set desired ready slots for one immutable qualified template
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PutWarmPoolRequest" } } }
      responses:
        "200": { description: desired pool state, content: { application/json: { schema: { $ref: "#/components/schemas/WarmPool" } } } }
        "409": { description: incompatible template, owner, profile or pool generation }
    delete:
      summary: Drain unused slots; claimed machines remain owned by their callers
      responses:
        "204": { description: drain recorded }
  /v1/namespaces/{id}/warm-pools/{name}/claims:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      summary: Transfer one existing paused reservation and return first-command readiness
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClaimWarmPoolRequest" } } }
      responses:
        "200": { description: same machine on idempotent retries, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "409": { description: "pool_empty, incompatible generation, or an existing claim with another name; no implicit refill or fresh allocation" }
  /v1/namespaces/{id}/quota:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: The namespace's quota and what it holds (ADR 0025)
      responses:
        "200": { description: quota, content: { application/json: { schema: { $ref: "#/components/schemas/NamespaceQuota" } } } }
        "404": { description: "`not_found`: the host (through the fleet, any host) has no such namespace" }
    put:
      summary: "Put the namespace's quota, whole (the namespace too, when it has nothing yet). Checked at create, fork, restore and gateway put (machines, disk) and at each start's reservation (memory, vCPUs); a refusal is 403 `quota` and a `quota_exceeded` event. One under the use stops nothing. Through the fleet, to the namespace's host; a namespace with none is placed, in `region`"
      parameters:
        - { name: region, in: query, schema: { type: string }, description: "fleet: where to place a namespace that has no host yet" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Quota" }
      responses:
        "200": { description: quota, content: { application/json: { schema: { $ref: "#/components/schemas/NamespaceQuota" } } } }
        "503": { description: "`capacity` (fleet): no host (of `region`) takes a new namespace" }
  /v1/namespaces/{id}/unpin:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Release a namespace from its host without touching the host (fleet only); its next machine is placed afresh, and the host's next heartbeat pins it again if the namespace still has machines there
      responses:
        "204": { description: released }
  /v1/hosts:
    get:
      summary: Hosts (fleet only)
      responses:
        "200": { description: hosts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Host" } } } } }
    post:
      summary: "Add a server (fleet only, ADR 0028; Kubernetes's `kubeadm join`): recorded `provisioning` with a fresh token, then bootstrapped over SSH and pinned (SSH key, API certificate). The fleet buys no server (ADR 0042)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddHostRequest" }
      responses:
        "202": { description: added, bootstrapped within two minutes, content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "400": { description: "`invalid`: an SSH address that is not one, an API address that is not an IPv4 address, or apart from the SSH address but outside `bootstrap.private_network`" }
        "409": { description: "`conflict`: a host has that id or address; `bootstrap_off`: `bootstrap.enabled` is false" }
  /v1/hosts/tokens:
    get:
      summary: "Join tokens, newest first (fleet only, ADR 0059): active, expired or revoked, with the number of joins and the last (which host, from which address). The secret is never listed"
      responses:
        "200": { description: tokens, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/JoinToken" } } } } }
    post:
      summary: "Make a join token (fleet only, ADR 0059; Kubernetes's bootstrap token, `kubeadm token create`): `<id>.<secret>` (`[a-z0-9]{6}.[a-z0-9]{16}`), valid for `ttl_sec` (24 hours by default, 0 never expires) and usable by any number of `POST /v1/hosts/join` until then or until it is revoked. Answered once with the secret, which the fleet does not keep (only its hash)"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateJoinTokenRequest" }
      responses:
        "201": { description: made, content: { application/json: { schema: { $ref: "#/components/schemas/JoinTokenCreated" } } } }
        "400": { description: "`invalid`: a `ttl_sec` over ten years (0 is a token that never expires), a description over 256 characters or with a line break, an address, a region, host or label that is not valid" }
        "409": { description: "`bootstrap_off`: `bootstrap.enabled` is false" }
  /v1/hosts/tokens/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    delete:
      summary: "Revoke a join token (fleet only), used or not: no new join takes it. The hosts that joined stay, and the listing keeps it as `revoked`"
      responses:
        "204": { description: revoked }
        "404": { description: no such token }
  /v1/hosts/join:
    post:
      summary: "A server joins (fleet only, ADR 0059; Kubernetes's `kubeadm join`): the join token is the bearer, and the call must come from the address the host will serve its API at. Recorded `joining`, with a token of its own for its API; answered with the settings of `hack/bootstrap-host.sh` by their environment names. The call counts a use of the token, which stays valid for other joins. The first heartbeat pins the host's certificate and makes it ready"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinRequest" }
      responses:
        "201": { description: joined, content: { application/json: { schema: { $ref: "#/components/schemas/JoinResponse" } } } }
        "400": { description: "`invalid`: an architecture or id that is not valid, or a caller that is not an IPv4 address" }
        "401": { description: "`invalid_token`: invalid, expired, revoked or bound to another address (one answer for all)" }
        "403": { description: "`unknown_host`: the fleet cannot see where the call came from, or `address` is not it; `wrong_name`: the token is bound to another id" }
        "409": { description: "`conflict`: a host has that id or address; `bootstrap_off`: `bootstrap.enabled` is false or `bootstrap.release` is empty" }
  /install.sh:
    get:
      summary: "The script a server runs to join (fleet only, ADR 0059): `curl -fsSL <fleet>/install.sh | FLEET_URL=<fleet> JOIN_TOKEN=<token> sh`. No token needed, none inside"
      responses:
        "200": { description: the script, content: { text/plain: { schema: { type: string } } } }
        "409": { description: "`bootstrap_off`" }
  /bootstrap-host.sh:
    get:
      summary: "The bootstrap script (fleet only): the one the SSH bootstrap sends, or `bootstrap.script`'s. Served only to the host that joined, with its own token from its own address (the script may hold what the operator wrote in `bootstrap.script`)"
      responses:
        "200": { description: the script, content: { text/plain: { schema: { type: string } } } }
        "409": { description: "`bootstrap_off`" }
  /v1/hosts/register:
    post:
      summary: A daemon's heartbeat (fleet only), with the host's own API token as the bearer, taken for the one host record that expects that token at the daemon's address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterHostRequest" }
      responses:
        "204": { description: recorded }
        "401": { description: not the token the fleet holds for the host at this address }
        "403": { description: no host is expected at this address (`unknown_host`) }
  /v1/hosts/key:
    post:
      summary: "A host's pool key (fleet only, ADR 0026): with the host's own API token as the bearer, for the one host record at the address it advertises; made at the first ask, the same after. With `key_id` and `restore`, the key of that id, a live or forgotten host's: the key a backup is encrypted under, served once for a restore the fleet forwarded to this host (ADR 0035)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostKeyRequest" }
      responses:
        "200": { description: the key, content: { application/json: { schema: { $ref: "#/components/schemas/HostKey" } } } }
        "401": { description: not the token the fleet holds for the host at this address }
        "403": { description: "no host is expected at this address (`unknown_host`); with `key_id`, no restore open for this host as named (`no_restore`)" }
        "404": { description: "with `key_id`: the fleet holds no pool key of that id (`no_key`)" }
        "500": { description: the registry could not be written (`registry`); no key is handed out unwritten }
        "503": { description: "the registry's backup could not be written (`backup`, ADR 0032); no key is handed out before the backup holds it" }
  /v1/metrics/targets:
    get:
      summary: "What a Prometheus scrapes (fleet only, ADR 0054), in its HTTP service discovery format: the fleet's own `/metrics` (`instance: fleet`), then each host that may run a daemon (ready, draining, retiring, upgrading, down) through its relay. Every target at the address the caller reached the fleet at (`Host`). Takes the metrics token or the API's"
      responses:
        "200":
          description: the targets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    targets: { type: array, items: { type: string }, description: "the fleet's address, as asked" }
                    labels:
                      type: object
                      description: "`instance` and `host` (the host's id), `region`, `__metrics_path__` (`/v1/hosts/{id}/metrics`); the fleet's: `instance: fleet` alone"
                      additionalProperties: { type: string }
        "400": { description: "no `Host` header (`invalid`)" }
  /v1/hosts/{id}/metrics:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: "A host's `/metrics` relayed (fleet only, ADR 0054): asked over the host's pinned TLS with its token, answered as the host's text as it is, or the host's own refusal. Takes the metrics token or the API's"
      responses:
        "200": { description: "the host's exposition", content: { text/plain: { schema: { type: string } } } }
        "404": { description: "no such host (`not_found`)" }
        "502": { description: "the host did not answer within 5 s, or cut its answer short (`host_unreachable`)" }
        "503": { description: "the host is down (`host_down`)" }
  /v1/hosts/{id}/retire:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Take no new namespace on a host and forget it once nothing runs on it (fleet only); the server is the operator's to give back
      responses:
        "200": { description: "`retiring`, or `retired` (forgotten) when it was already empty", content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "409": { description: the host is upgrading (`conflict`) }
  /v1/hosts/{id}/drain:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Take no new namespace on this host, and keep it (fleet only; Kubernetes's cordon)
      responses:
        "204": { description: draining }
        "409": { description: the host is upgrading (`conflict`) }
  /v1/hosts/{id}/undrain:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Take new namespaces on a draining or retiring host again (fleet only)
      responses:
        "204": { description: ready }
        "409": { description: "the host is neither draining nor retiring (`conflict`)" }
  /v1/hosts/{id}/upgrade:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: "Install another release on a ready or draining host, its machines running (fleet only, ADR 0027): the host `upgrading`, `hack/bootstrap-host.sh` run over SSH with the release, the daemon handing its machines over to the new one, then a heartbeat from a new start of the installed version that stopped no machine; the host back in its state. Answers when it is done; one upgrade at a time"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpgradeHostRequest" }
      responses:
        "200": { description: "upgraded; the note says to what and how many machines were handed over", content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "400": { description: "a release that is neither a URL nor a version, or no SSH key (`bootstrap.ssh_key`)" }
        "404": { description: no such host }
        "409": { description: "another upgrade under way, or the host is neither ready nor draining (`conflict`)" }
        "502": { description: "the upgrade failed (`upgrade_failed`): the host is `draining`, the reason in its note" }
  /v1/hosts/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    delete:
      summary: "Forget a host (fleet only). A host whose record holds a pool key is refused unless `force`: the key goes with the record (ADR 0026)"
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false }, description: "forget a host that holds a pool key: its pool is unreadable at its next restart" }
      responses:
        "204": { description: forgotten }
        "409": { description: "the host holds a pool key (`pool_key`): retire it, or force" }
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    snap:
      name: snap
      in: path
      required: true
      description: a snapshot's id or name
      schema: { type: string }
    ifMatch:
      name: If-Match
      in: header
      description: "the machine's `version` as last read (ADR 0019): the call is refused with 409 `conflict` when it moved since. Absent: no condition"
      schema: { type: integer }
  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Moved:
      description: "`conflict`: `If-Match` names a version the machine moved past; the body's `machine` is it as it is"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
