    Size:
      type: object
      required: [vcpus, memory_mb]
      properties:
        vcpus: { type: integer, minimum: 1, maximum: 32, description: guest CPUs }
        cpu_millis: { type: integer, minimum: 1, maximum: 32000, description: "CPU time limit in thousandths of a CPU; at most vcpus × 1000. Omitted means vcpus × 1000. Fractional limits require a jailed host." }
        memory_mb: { type: integer, minimum: 128, maximum: 262144 }
    VolumeSpec:
      type: object
      required: [size_gb, mount]
      properties:
        size_gb: { type: integer, minimum: 1 }
        mount: { type: string, description: absolute path in the machine }
    VolumeSize:
      type: object
      required: [size_gb]
      additionalProperties: false
      properties:
        size_gb: { type: integer, minimum: 1 }
    File:
      type: object
      required: [path, base64]
      properties:
        path: { type: string }
        base64: { type: string }
        mode: { type: string, description: octal digits, default "0644" }
    RestartPolicy:
      type: object
      properties:
        policy: { type: string, enum: ["no", on-failure, always], default: on-failure }
        max_retries: { type: integer, default: 3 }
    RestoreSpec:
      type: object
      required: [machine_id]
      properties:
        machine_id: { type: string, description: the backed-up machine; it may no longer exist }
        backup: { type: string, description: a backup id, or "latest" (the default) }
    BackupPolicy:
      type: object
      required: [every, keep]
      description: "a backup every `every`, the newest `keep` kept with what they continue from (ADR 0023); a refusal names the field (`backup.every`, `backup.keep`)"
      properties:
        every: { type: string, description: '"6h", "1d": at least 1h' }
        keep: { type: integer, minimum: 1 }
    Backup:
      type: object
      properties:
        size: { allOf: [{ $ref: "#/components/schemas/Size" }], description: "size captured in the backup; older sealed records may omit it, requiring an explicit restore size through the fleet" }
        id: { type: string, description: "a timestamp to the millisecond (20261021T101500.123Z), later ids sort later" }
        machine_id: { type: string }
        namespace: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        bytes: { type: integer }
        incremental: { type: boolean }
        disks:
          type: array
          items:
            type: object
            properties:
              disk: { type: string, enum: [root, data] }
              key: { type: string }
              bytes: { type: integer }
              from: { type: string, description: the backup this stream continues from }
        key_id: { type: string, description: "the id of the pool key the streams are encrypted under (raw sends, ADR 0035): a hash, never the key; absent: streams in clear, made before ADR 0035" }
        deletes_at: { type: string, format: date-time, description: "a destroyed machine's backup: when the host deletes it (`backup.keep_destroyed_days` after the destroy)" }
    MoveRequest:
      type: object
      required: [namespace]
      properties:
        namespace: { type: string, description: the namespace it joins; made when it does not exist }
    MoveResult:
      type: object
      required: [machine, from, previous_ip, restarted]
      properties:
        machine: { $ref: "#/components/schemas/Machine" }
        from: { type: string, description: the namespace it left }
        previous_ip: { type: string, description: its address before; equal to `machine.ip` for a rename }
        restarted: { type: boolean, description: "a running machine was stopped and started on the namespace's network (its programs began again, on a new address); false for a rename and for a machine that was not running" }
    ForkSpec:
      type: object
      required: [machine_id]
      properties:
        machine_id: { type: string }
        copy: { type: string, enum: [disk, config], default: disk }
    Egress:
      type: object
      description: "where the machine's traffic may go, enforced on the host (ADR 0015); a refusal names the field"
      properties:
        mode: { type: string, enum: [open, via, none], default: open, description: "open: its namespace and the internet; via: only the `via` machine (any port) and its gateway's DNS; none: its namespace, no internet. Under via and none, DNS answers internal names only (NXDOMAIN for the rest)" }
        via: { type: string, description: "for `via` only: a machine of the same namespace, not this one, or `gateway`: the namespace's gateway, started before this machine and kept running while it runs" }
    EgressLimits:
      type: object
      description: "limits on the machine's internet traffic, through the host's NAT, enforced on the host (ADR 0018); `via` and `none` machines never reach it. In a request an absent field keeps the machine's value (on create, the host's `egress_limits`); in a machine, every field is there: the values in force"
      properties:
        blocked_ports: { type: array, items: { type: integer, minimum: 1, maximum: 65535 }, description: "destination ports refused, TCP (reset) and UDP (ICMP port unreachable); `[]` refuses none. Host default: [25]" }
        new_connections_per_minute: { type: integer, minimum: 0, description: "new connections a minute, as many at once; over it, dropped. 0: no limit" }
        bandwidth_mbit: { type: integer, minimum: 0, maximum: 100000, description: "Mbit/s, in and out together; over it, dropped. 0: no limit" }
    DiskLimits:
      type: object
      description: "limits on each of the machine's disks, the root disk and the volume, by Firecracker's rate limiter (ADR 0030); over them the guest's requests wait. In a request an absent field keeps the machine's value (on create, the host's `disk_limits` for its size: a rate per vCPU); in a machine, every field is there: the values in force"
      properties:
        bandwidth_mb: { type: integer, minimum: 0, maximum: 100000, description: "MB (2^20 bytes) a second, reads and writes together. 0: no limit. Host default: 32 per vCPU" }
        iops: { type: integer, minimum: 0, maximum: 10000000, description: "requests a second (reads, writes, flushes). 0: no limit. Host default: 4000 per vCPU" }
        burst_sec: { type: integer, minimum: 0, maximum: 3600, description: "what each limit lets through at full speed once after a start, a wake or a change, in seconds at its rate. Host default: 10" }
    EgressDrops:
      type: object
      description: packets the machine's limits dropped since it started (or the daemon did), read every 15 s
      properties:
        blocked_port: { type: integer }
        rate: { type: integer }
        bandwidth: { type: integer }
    CreateMachineRequest:
      type: object
      required: [namespace, name, size]
      properties:
        namespace: { type: string, description: "owns the machine and its network: a-z, 0-9, _ and -, at most 64 characters" }
        name: { type: string, description: a DNS label, unique in the namespace; `<name>.internal` resolves to the machine }
        image: { type: string, description: an OCI reference; required unless `fork` is set }
        entrypoint: { type: array, items: { type: string } }
        cmd: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        files: { type: array, items: { $ref: "#/components/schemas/File" } }
        size: { $ref: "#/components/schemas/Size" }
        volume: { $ref: "#/components/schemas/VolumeSpec" }
        ports: { type: array, items: { type: integer } }
        sleep: { type: string, description: '"30m", "2h", "7d" or "never"; stops the machine after that long without use' }
        restart: { $ref: "#/components/schemas/RestartPolicy" }
        metadata: { type: object, additionalProperties: { type: string }, description: "kept as is; the labels `?label=` selects on" }
        region: { type: string, description: "fleet: a new namespace is placed on a host of this region (a host's `region`); a namespace's machines stay in its host's (ADR 0025). Absent: any. A daemon ignores it" }
        egress: { allOf: [{ $ref: "#/components/schemas/Egress" }], description: "absent: open, or for a restore the backup's" }
        limits: { allOf: [{ $ref: "#/components/schemas/EgressLimits" }], description: "over the host's, field by field; absent: the host's, or for a restore the backup's" }
        disk_limits: { allOf: [{ $ref: "#/components/schemas/DiskLimits" }], description: "over the host's for its size, field by field; absent: the host's, or for a restore the backup's" }
        backup: { oneOf: [{ $ref: "#/components/schemas/BackupPolicy" }, { type: "null" }], description: "absent: the host's `backup.default_every` and `default_keep` (none unless configured); null: none. A restore or a fork takes this, not its source's" }
        probes: { allOf: [{ $ref: "#/components/schemas/Probes" }], description: "absent: none, or for a restore the backup's" }
        start: { type: boolean, default: true, description: "its create starts it once its disks are made; the answer comes at `creating`: `/wait` for `running` or `ready`" }
        fork: { $ref: "#/components/schemas/ForkSpec" }
        restore: { $ref: "#/components/schemas/RestoreSpec" }
    Exit:
      type: object
      properties:
        code: { type: integer }
        oom_killed: { type: boolean }
        at: { type: string, format: date-time }
        restarting: { type: boolean }
    Machine:
      type: object
      properties:
        id: { type: string }
        namespace: { type: string }
        name: { type: string }
        image: { type: string }
        image_digest: { type: string }
        state: { type: string, enum: [creating, created, starting, running, stopping, stopped, destroying, error], description: "`creating`: recorded, its image pulled and its disks made in the background, then started unless asked not to (ADR 0048); only `GET`, `/wait`, endpoints and `DELETE` act on it (a start or a wake asks its create to start it)" }
        stopped_reason: { type: string, enum: [user, idle, exit, host], description: "why it is stopped: asked, the sleep window ran out, its process ended, or the daemon stopped it (a shutdown, a leftover of a crashed daemon; wakeable like idle)" }
        exit: { $ref: "#/components/schemas/Exit" }
        error: { type: string }
        error_reason: { type: string, enum: [pull_failed, create_failed, boot_failed, start_failed], description: "in `error`: the event that put it there. `pull_failed` (its image could not be pulled) and `create_failed` (its disks could not be made, its create's start was refused, or the daemon restarted during a fork's or a restore's create; one from an image is taken up again) leave no disks: destroy it and create again" }
        ip: { type: string }
        hostname: { type: string, description: "`<name>.internal`, follows the name" }
        machine_host: { type: string, description: "`<id>.vm.internal`, this exact machine" }
        size: { $ref: "#/components/schemas/Size" }
        volume: { $ref: "#/components/schemas/VolumeSpec" }
        ports: { type: array, items: { type: integer } }
        sleep: { type: string }
        restart: { $ref: "#/components/schemas/RestartPolicy" }
        restarts: { type: integer, description: "restarts in a row by the restart policy; reset by an exit it does not restart" }
        restarting_at: { type: string, format: date-time, description: "while `stopped (exit)` and waiting for its restart: when it starts again (10 s doubling to 5 minutes, reset by a run of 10 minutes)" }
        ready: { type: boolean, description: "running and serving: true at once without a startup or readiness probe, else once they passed; false whenever it is not running" }
        probes: { $ref: "#/components/schemas/Probes" }
        probes_status: { $ref: "#/components/schemas/ProbesStatus" }
        egress: { $ref: "#/components/schemas/Egress" }
        limits: { $ref: "#/components/schemas/EgressLimits" }
        egress_drops: { $ref: "#/components/schemas/EgressDrops" }
        disk_limits: { $ref: "#/components/schemas/DiskLimits" }
        metadata: { type: object, additionalProperties: { type: string } }
        endpoints: { type: array, items: { $ref: "#/components/schemas/Endpoint" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: moves on every write, a touch included }
        state_changed_at: { type: string, format: date-time, description: moves only when `state` does }
        started_at: { type: string, format: date-time }
        stopped_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        sleeps_at: { type: string, format: date-time, description: when it stops if nothing uses it }
        backup: { $ref: "#/components/schemas/BackupPolicy" }
        last_backup_at: { type: string, format: date-time, description: when its newest backup in the store was made }
        next_backup_at: { type: string, format: date-time, description: "when the daemon backs it up next: `every` after the last backup, 15 minutes after a failed one; a machine with no process whose disks wrote nothing is not backed up again and its time moves on" }
        version: { type: integer, description: "the seq of the last event about it: every event moves it, a folded readiness flip too (ADR 0047), its last use does not; what `If-Match` compares" }
        pending: { $ref: "#/components/schemas/Pending" }
        pending_since: { type: string, format: date-time, description: "when the oldest change still pending was made" }
        init_version: { type: string, description: "what the init in its root disk said at its last boot (ADR 0027); empty before it, or from an init older than the report" }
        vmm_version: { type: string, description: "what ran its last boot: Firecracker's version and the host kernel's release, `v1.17.0/6.8.0-45-generic`; a memory snapshot resumes only under the same" }
        host: { type: string, description: the host that runs it (fleet) }
    Endpoint:
      type: object
      properties:
        id: { type: string }
        machine_id: { type: string }
        port: { type: integer }
        protocol: { type: string, enum: [tcp, http] }
        host_port: { type: integer }
        host: { type: string }
        address: { type: string, description: '"<ip>:<host_port>" or "http://<host>"' }
        created_at: { type: string, format: date-time }
    CreateEndpointRequest:
      type: object
      required: [port]
      properties:
        port: { type: integer }
        protocol: { type: string, enum: [tcp, http], default: tcp }
        host: { type: string, description: the label before the domain, for http }
    ExecRequest:
      type: object
      required: [cmd]
      properties:
        cmd: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        cwd: { type: string }
        stdin: { type: string }
        timeout_ms: { type: integer, default: 300000, maximum: 3600000 }
        wake: { type: boolean, default: true, description: Wake a sleeping machine for the command; false answers 409 when it is not running }
    SessionEnd:
      type: object
      description: "the last message of a session (channel 3): how the command ended (`exit_code`, `timed_out` when its deadline ended it), or, with `code` and no `exit_code`, why the session ended without it (`not_running`: the machine went down; `invalid`: a message the server could not read; `internal`)"
      properties:
        exit_code: { type: integer }
        timed_out: { type: boolean }
        code: { type: string }
        error: { type: string }
    Resize:
      type: object
      required: [cols, rows]
      properties:
        cols: { type: integer }
        rows: { type: integer }
    ExecResult:
      type: object
      properties:
        stdout: { type: string }
        stderr: { type: string }
        exit_code: { type: integer }
        timed_out: { type: boolean }
    PutFileRequest:
      type: object
      required: [path, base64]
      properties:
        path: { type: string }
        base64: { type: string }
        mode: { type: string }
    FileResponse:
      type: object
      properties:
        path: { type: string }
        base64: { type: string }
    LogLine:
      type: object
      properties:
        ts: { type: string, format: date-time }
        line: { type: string }
    LogsResponse:
      type: object
      properties:
        lines: { type: array, items: { $ref: "#/components/schemas/LogLine" } }
        next: { type: string }
    UpdateMachineRequest:
      type: object
      properties:
        sleep: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        egress: { allOf: [{ $ref: "#/components/schemas/Egress" }], description: "absent keeps the current one" }
        limits: { allOf: [{ $ref: "#/components/schemas/EgressLimits" }], description: "the fields it names change, the others stay" }
        disk_limits: { allOf: [{ $ref: "#/components/schemas/DiskLimits" }], description: "the fields it names change, the others stay; a running machine's disks take them at once (their buckets full again)" }
        backup: { oneOf: [{ $ref: "#/components/schemas/BackupPolicy" }, { type: "null" }], description: "absent keeps it, null removes it; the next time is `every` after the last backup" }
        probes: { allOf: [{ $ref: "#/components/schemas/Probes" }], description: "replaces them all; a running machine's start over at once, `ready` as at a boot" }
        image: { type: string, description: "at the next start: pulled and built then (a failure is `boot_failed`, the change still pending), the root disk made again from it, the data volume kept" }
        entrypoint: { type: array, items: { type: string }, description: at the next start }
        cmd: { type: array, items: { type: string }, description: at the next start }
        env: { type: object, additionalProperties: { type: string }, description: "the whole env, at the next start; write-only" }
        files: { type: array, items: { $ref: "#/components/schemas/File" }, description: "all the boot files, at the next start; write-only" }
        size: { allOf: [{ $ref: "#/components/schemas/Size" }], description: "at the next start, reserved then: 503 `capacity` past the host's memory" }
        ports: { type: array, items: { type: integer }, description: at the next start }
        restart: { allOf: [{ $ref: "#/components/schemas/RestartPolicy" }], description: at the next start }
        volume: { allOf: [{ $ref: "#/components/schemas/VolumeSize" }], description: "larger than it is (the same size is no change): the disk grows at once, the namespace's quota and the pool's free space checked as at a create; the guest's filesystem grows at the next start, which is cold (ADR 0040)" }
    Pending:
      type: object
      description: "what the next start applies (ADR 0024); a change to the image, entrypoint, command, env, files, size or volume also makes that start cold, its memory snapshot dropped"
      properties:
        fields: { type: array, items: { type: string, enum: [image, entrypoint, cmd, env, files, size, ports, restart, volume] } }
        image: { type: string }
        size: { $ref: "#/components/schemas/Size" }
        ports: { type: array, items: { type: integer } }
        restart: { $ref: "#/components/schemas/RestartPolicy" }
        volume: { allOf: [{ $ref: "#/components/schemas/VolumeSize" }], description: "the size its disk has already; the guest's filesystem grows to it at the next start (ADR 0040)" }
    Probe:
      type: object
      description: "a check the daemon runs on a running machine (ADR 0022): exactly one of `exec`, `tcp` and `http`. Not a use: it never postpones sleep"
      properties:
        exec: { type: array, items: { type: string }, minItems: 1, description: "run in the machine through its init; exit 0 passes" }
        tcp: { type: integer, minimum: 1, maximum: 65535, description: "a connect from the host to this port of the machine's address" }
        http: { $ref: "#/components/schemas/HttpProbe" }
        period_sec: { type: integer, minimum: 1, default: 10 }
        timeout_sec: { type: integer, minimum: 1, default: 5, description: "for one execution, counted once it holds its turn (32 at once per host)" }
        failure_threshold: { type: integer, minimum: 1, default: 3, description: failures in a row that fail it }
        success_threshold: { type: integer, minimum: 1, default: 1, description: "passes in a row that pass it; must be 1 for startup and liveness" }
        initial_delay_sec: { type: integer, minimum: 0, default: 0, description: "from when it may run: the boot, or the startup probe's pass" }
    HttpProbe:
      type: object
      required: [port]
      properties:
        port: { type: integer, minimum: 1, maximum: 65535 }
        path: { type: string, default: /, description: "a GET from the host; 200 to 399 passes" }
    Probes:
      type: object
      description: "startup runs first and gates the others; readiness sets `ready`; liveness failures end the process, a failure for the restart policy. A startup failure on a run a caller asked for (create, start, wake) fails the boot: `error`, no restart; on a run the restart policy started, it is a crash like a liveness failure"
      properties:
        startup: { $ref: "#/components/schemas/Probe" }
        readiness: { $ref: "#/components/schemas/Probe" }
        liveness: { $ref: "#/components/schemas/Probe" }
    ProbeStatus:
      type: object
      properties:
        passed: { type: boolean, description: the last execution passed }
        message: { type: string, description: "what it answered: `exit 1: …`, `HTTP 503`, a connect error" }
        failures: { type: integer, description: failures in a row }
        at: { type: string, format: date-time }
    ProbesStatus:
      type: object
      description: each probe's last result in the current run, in memory (a daemon restart runs them again); absent before its first execution
      properties:
        startup: { $ref: "#/components/schemas/ProbeStatus" }
        readiness: { $ref: "#/components/schemas/ProbeStatus" }
        liveness: { $ref: "#/components/schemas/ProbeStatus" }
    StopRequest:
      type: object
      properties:
        suspend: { type: boolean, description: keep a memory snapshot so the next start resumes in well under a second; a plain stop when Firecracker refuses }
        timeout_sec: { type: integer, default: 10, maximum: 600 }
    SnapshotRequest:
      type: object
      properties:
        name: { type: string, description: "to find it by again: a-z, 0-9, _ and -, at most 64, not starting with s_; unique on the machine" }
        memory: { type: boolean, description: "its memory too, on a running machine, paused while it is written: a restore resumes its processes where they were" }
    Snapshot:
      type: object
      properties:
        id: { type: string }
        machine_id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        disks: { type: array, items: { type: string, enum: [root, data] }, description: "the disks it holds; a new image drops root (ADR 0024)" }
        memory: { type: boolean, description: "it holds the memory: a restore resumes, unless the image, command, env, files or size changed since" }
    MachineStats:
      type: object
      properties:
        state: { type: string }
        cpu_usec: { type: integer }
        memory_bytes: { type: integer }
        uptime_sec: { type: integer }
        disk_bytes: { type: integer }
    Image:
      type: object
      properties:
        key: { type: string }
        ref: { type: string }
        digest: { type: string }
        size_gb: { type: integer }
        built_at: { type: string, format: date-time }
        machines: { type: integer }
