openapi: 3.1.0
info:
  title: briqyard
  version: v0
  description: |
    Machines in Firecracker microVMs: on one host (briqyardd, port 7420) or across hosts
    (briqyard-fleet, port 7430, the same routes plus /v1/hosts). The API is not stable yet.

    Authentication: `Authorization: Bearer <token>` when the server has a token configured.
    Every response carries `x-request-id`; error bodies repeat it as `request_id`.
servers:
  - url: http://127.0.0.1:7420
    description: a daemon
  - url: http://127.0.0.1:7430
    description: a fleet
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200": { description: ok }
  /v1/status:
    get:
      summary: "The host's capacity and use; through the fleet, the ready hosts' and each region's room (ADR 0042)"
      responses:
        "200":
          description: status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /v1/machines:
    get:
      summary: "List machines, a tenant's or every one; through the fleet, the tenant's host or every host, never partial (ADR 0006)"
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
        - { name: label, in: query, style: form, explode: true, schema: { type: array, items: { type: string } }, description: "repeatable, every one ANDed (ADR 0025): `key=value` (the machine's `metadata` has it) or `key` (has the key); a key is an optional DNS prefix and `/`, then at most 63 of a-z, A-Z, 0-9, `-_.`, alphanumeric at both ends; a value empty or the same. `!=`, `!key`, `in` and `notin` are refused" }
      responses:
        "200":
          description: machines
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Machine" } }
        "400": { description: "`invalid`: a label selector that is not `key=value` or `key`" }
    post:
      summary: Create a machine (pulls the image when the host has not seen it)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMachineRequest" }
      responses:
        "201":
          description: created and, unless `start` is false, running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "400": { description: "`invalid`: a bad field, named; a fork's or a restore's `volume` smaller than its source's (`a volume never shrinks`; a larger one grows the disk, ADR 0040); through the fleet, a `region` other than the tenant's (its host's: a tenant never spans regions)" }
        "403": { description: "`quota`: past a limit of the tenant's quota, the limit and the use in `error`; nothing made" }
        "409": { description: "`conflict`: a machine with that name exists in the tenant; `boot_failed`: made but the guest did not come up, the body's `machine` is it, in state `error`, kept for its console and a destroy" }
        "503": { description: "`capacity`: the host has no room (its memory, or for a volume its pool's free space); through the fleet, no host (of `region`, when given) has room" }
  /v1/machines/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    description: "A tenant's gateway answers GET, `/logs`, `/stats` and `/wait` here like any machine; every other route on its id answers 409 `gateway` (`/v1/tenants/{id}/gateway` owns it)."
    get:
      summary: A machine
      responses:
        "200": { description: machine, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Change the sleep window, the metadata, the egress policy, the limits or the probes, in any state; a running machine's policy and limits change at once, and its probes start over as at a boot. The image, entrypoint, command, env, files, size, ports and restart policy change at the next start (ADR 0024), `pending` until then, a running machine running on unchanged; `/restart` applies them now. A larger `volume` grows its disk at once and its filesystem at the next start, `pending` until then (ADR 0040). A change is an event (`egress_changed` for the policy or the limits, else `updated`, with `pending` for what waits for the next start) and moves `version`; a request that changes nothing does neither
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMachineRequest" }
      responses:
        "200": { description: machine, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "400": { description: "`invalid`: a bad sleep window, an `egress` the machine cannot take, bad `limits` or `probes` (the field named), a spec field a create would refuse (same message), a `volume` smaller than the machine's (`a volume never shrinks`) or on a machine without one, or an `If-Match` that is not a number" }
        "403": { description: "`quota`: a volume's growth would pass the tenant's `disk_gb`; nothing changed, a `quota_exceeded` event about it" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Moved" }
        "503": { description: "`capacity`: the pool has less free than a volume's growth" }
    delete:
      summary: Destroy a machine, its endpoints and its disks
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "204": { description: destroyed (or already gone) }
        "409": { $ref: "#/components/responses/Moved" }
  /v1/machines/{id}/start:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Boot a created or stopped machine
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { description: machine, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "400": { description: "`invalid`: its `egress.via` names a machine that is gone, or `gateway` in a tenant that has none" }
        "403": { description: "`quota`: its memory or vCPUs would pass the tenant's quota; not moved, a `quota_exceeded` event about it" }
        "409": { description: "`bad_state`: busy (starting, stopping or destroying); `boot_failed`: the guest did not come up, the body's `machine` is it, in state `error`; or the tenant's gateway did not come up, the body's `machine` is this one, not moved, the gateway's reason in its `error`; `conflict`: `If-Match` names a version it moved past, the body's `machine` is it as it is" }
        "503": { description: "`capacity`: the host has no room" }
  /v1/machines/{id}/wake:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Start a machine that went to sleep (idle), that the host stopped, or whose process ended; one stopped on request stays stopped
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { description: machine, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "409": { description: "`not_running`: stopped on request; `bad_state`: busy or in error; `boot_failed`: the guest did not come up; `conflict`: a stale `If-Match`" }
  /v1/machines/{id}/stop:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Stop a machine (SIGTERM to its process, SIGKILL after the timeout); disks are kept. A client that hangs up does not cancel this, nor any transition.
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StopRequest" }
      responses:
        "200": { description: machine, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "409": { $ref: "#/components/responses/Moved" }
  /v1/machines/{id}/restart:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Stop the machine and start it again, applying what a PATCH left `pending` (ADR 0024); one that is not running is started. `If-Match` is checked by the stop
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { description: machine, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "409": { description: "`bad_state`: destroying; `boot_failed`: the new spec did not boot, or its image could not be pulled (the change still pending), the body's `machine` is it, in state `error`; `conflict`: a stale `If-Match`" }
        "503": { description: "`capacity`: the host has no room for its size; the change stays pending" }
  /v1/machines/{id}/touch:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Record use, which postpones sleep
      responses:
        "204": { description: recorded }
  /v1/machines/{id}/wait:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: timeout, in: query, schema: { type: integer, default: 60, maximum: 600 }, description: seconds }
      - { name: for, in: query, schema: { type: string, enum: [ready, running], default: ready }, description: "`ready`: running and its probes say it serves (ADR 0022); `running`: its init answered" }
    post:
      summary: Wait until the machine is ready (or running, with `for=running`)
      responses:
        "200": { description: ready (or running), content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "400": { description: "`invalid`: `for` is not `ready` or `running`" }
        "409": { description: "`not_ready`: still running not ready at the timeout, the body's `machine` is it with its `probes_status`; `boot_failed` (`for=ready`): it is in `error`, its guest or its startup probe failed the boot, the body's `machine` is it; `not_running`: it will not run (stopped, destroying; `error` with `for=running`), or did not start in time" }
  /v1/machines/{id}/exec:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: "An exec session (ADR 0029): a WebSocket upgrade (`Connection: Upgrade`, `Upgrade: websocket`, the bearer token as for every route). Every message is binary, its first byte the channel: 0 stdin (to the server), 1 stdout, 2 stderr (empty with `tty`), 3 the end (`SessionEnd`, last), 4 a resize (`Resize`, to the server), 255 a close (payload `0`: stdin's end; nothing on a terminal, where ^D is a byte). The command starts before the `101`; closing the connection ends it (SIGKILL to its process group; on a terminal SIGHUP first, SIGKILL 5 s later). The machine is in use while the session is open: it does not go to sleep. A ping every 30 s; a client silent for 90 s is gone. A `session_opened` event. Through the fleet, relayed as bytes to the machine's host"
      parameters:
        - { name: cmd, in: query, required: true, schema: { type: array, items: { type: string } }, style: form, explode: true, description: "one per argument, in order" }
        - { name: env, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true, description: "`NAME=VALUE`, one per variable" }
        - { name: cwd, in: query, schema: { type: string } }
        - { name: timeout_ms, in: query, schema: { type: integer, default: 0, maximum: 3600000 }, description: "the command's deadline; 0 is none: it lasts as long as the session" }
        - { name: wake, in: query, schema: { type: boolean, default: true }, description: "wake a sleeping machine (and wait for it to be ready) before the command" }
        - { name: tty, in: query, schema: { type: boolean, default: false }, description: "a pseudo-terminal: one output, `TERM` from `env` (`xterm` when absent), the command its session leader" }
        - { name: cols, in: query, schema: { type: integer, default: 80, maximum: 65535 } }
        - { name: rows, in: query, schema: { type: integer, default: 24, maximum: 65535 } }
      responses:
        "101": { description: "the session; its messages as above" }
        "400": { description: "`invalid`: not an upgrade, no `cmd`, an unknown parameter or a value that does not parse" }
        "404": { description: "`not_found`" }
        "409": { description: "`not_running`: not running and `wake` was false, or the guest did not take the command; `boot_failed`: the wake did not boot" }
    post:
      summary: Run a command inside the machine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200": { description: output, content: { application/json: { schema: { $ref: "#/components/schemas/ExecResult" } } } }
        "409": { description: not running (and `wake` was false) }
  /v1/machines/{id}/files:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: Read a file from a running machine
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: file, content: { application/json: { schema: { $ref: "#/components/schemas/FileResponse" } } } }
    put:
      summary: Write a file into a running machine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutFileRequest" }
      responses:
        "204": { description: written }
  /v1/machines/{id}/logs:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: since, in: query, schema: { type: string }, description: "the `next` cursor of a previous page: an offset in the whole console, its rotated file included (ADR 0021); one rotated away reads on from the oldest line kept" }
      - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 5000 } }
      - { name: follow, in: query, schema: { type: boolean, default: false }, description: "keep it open (ADR 0025): the lines after `since`, then each new one, as NDJSON" }
    get:
      summary: "The serial console, paged. With `follow=true`, NDJSON kept open: one `LogLine` per line, across a rotation, `{}` every 30 s, and a last line `{code, error}` when it ends (`destroyed`: the machine was; `shutdown`: the daemon goes down, follow again from the `since` in `error`). Through the fleet a follow is streamed through"
      responses:
        "200":
          description: a page, or with `follow` a stream
          content:
            application/json: { schema: { $ref: "#/components/schemas/LogsResponse" } }
            application/x-ndjson: { schema: { $ref: "#/components/schemas/LogLine" } }
  /v1/machines/{id}/stats:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: CPU, memory and disk the machine uses now (CPU and memory on jailed hosts)
      responses:
        "200": { description: stats, content: { application/json: { schema: { $ref: "#/components/schemas/MachineStats" } } } }
  /v1/machines/{id}/backups:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: The backups of a machine id in the store, oldest first; the machine may be gone, the store is shared across hosts
      responses:
        "200": { description: backups, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Backup" } } } } }
    post:
      summary: "Send the machine's disks to the backup store (crash-consistent while it runs), after any backup of it under way: whole the first time and every `keep`-th, else what changed since the last; then, with a schedule, the backups that are neither among the newest `keep` nor a base of one go (ADR 0023). Its schedule's next time is `every` from now"
      responses:
        "201": { description: backup made, content: { application/json: { schema: { $ref: "#/components/schemas/Backup" } } } }
        "400": { description: backups are off on this host }
  /v1/machines/{id}/backups/{backup}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: backup, in: path, required: true, schema: { type: string } }
      - { name: chain, in: query, description: "also delete every backup that continues from it", schema: { type: boolean, default: false } }
      - { name: tenant, in: query, description: "through the fleet, for a machine destroyed: its tenant finds its host", schema: { type: string } }
    delete:
      summary: "Delete a backup of a machine of this host, or of one destroyed here (ADR 0023): its streams, then its record; a `backup_deleted` event"
      responses:
        "204": { description: deleted }
        "404": { description: "`not_found`: no such machine here, or no such backup of it" }
        "409": { description: "`conflict`: other backups continue from it, named in `error`; `?chain=true` deletes them too" }
  /v1/backups:
    get:
      summary: "Every backup of the host's machines, destroyed ones' included, by machine then age (ADR 0023); a destroyed machine's carry `deletes_at`. Through the fleet: with `tenant`, the tenant's host; else every host, never partial"
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
      responses:
        "200": { description: backups, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Backup" } } } } }
        "400": { description: "`invalid`: backups are off on this host, or a bad tenant id" }
  /v1/machines/{id}/snapshots:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: List its snapshots, oldest first (ADR 0031)
      responses:
        "200": { description: snapshots, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Snapshot" } } } } }
    post:
      summary: "Snapshot both disks at one instant, and the memory with `memory: true`; a `snapshot_taken` event"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapshotRequest" }
      responses:
        "201": { description: snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/Snapshot" } } } }
        "400": { description: "`invalid`: a bad name" }
        "409": { description: "`conflict`: the name is taken; `not_running`: memory asked of a machine with no process; `bad_state`: destroying, or a restore unfinished" }
  /v1/machines/{id}/snapshots/{snap}:
    parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/snap" }]
    delete:
      summary: "Delete a snapshot, from both disks and its memory; missing is success; a `snapshot_deleted` event. What a retired disk still clones goes with it"
      responses:
        "204": { description: deleted }
        "404": { description: no such machine }
        "409": { description: "`bad_state`: a restore unfinished" }
  /v1/machines/{id}/snapshots/{snap}/restore:
    parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/snap" }]
    post:
      summary: "Take the disks back to the snapshot, and the memory when it holds it and the spec is the same (ADR 0031): a running machine is stopped, then booted or resumed; any other stays as it is. Newer snapshots, forks and the backup chain are kept. A `restored` event"
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { description: machine, content: { application/json: { schema: { $ref: "#/components/schemas/Machine" } } } }
        "404": { description: "`not_found`: no such machine or snapshot" }
        "409": { description: "`bad_state`: starting, stopping or destroying; `boot_failed`: restored, then the guest did not come up; `conflict`: a stale `If-Match`" }
        "500": { description: "`internal`: the disks could not be swapped; the restore is finished by the next restore, start or daemon start" }
  /v1/machines/{id}/endpoints:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Open a port of the machine to the outside; a connection wakes a sleeping machine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEndpointRequest" }
      responses:
        "201": { description: endpoint, content: { application/json: { schema: { $ref: "#/components/schemas/Endpoint" } } } }
  /v1/endpoints:
    get:
      summary: List endpoints
      responses:
        "200": { description: endpoints, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Endpoint" } } } } }
  /v1/endpoints/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: An endpoint
      responses:
        "200": { description: endpoint, content: { application/json: { schema: { $ref: "#/components/schemas/Endpoint" } } } }
    delete:
      summary: Close an endpoint
      responses:
        "204": { description: closed }
  /v1/images:
    get:
      summary: Images built on the host, with how many machines clone each
      responses:
        "200": { description: images, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Image" } } } } }
  /v1/images/{key}:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    delete:
      summary: Remove an image no machine uses
      responses:
        "204": { description: removed }
        "409": { description: machines still use it }
  /v1/usage:
    get:
      summary: "What each machine used, per UTC hour (ADR 0017): measures, no price. The open hour's buckets grow until it closes; a closed bucket never changes; a destroyed machine's stay for `usage_keep_days`. The fleet asks every host and fails when one does not answer, as listings do, and sets `host` on each bucket"
      parameters:
        - { name: from, in: query, required: true, description: "the first hour, RFC 3339 (2026-10-20T14:00:00Z)", schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, description: "the hour after the last; at most 31 days after `from`", schema: { type: string, format: date-time } }
        - { name: tenant, in: query, schema: { type: string } }
      responses:
        "200": { description: "buckets, by hour then machine", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/UsageBucket" } } } } }
        "400": { description: "`invalid`: `from` or `to` missing, not RFC 3339, not on the hour, `to` not after `from`, or more than 31 days" }
  /v1/top:
    get:
      summary: "The running machines' use over the daemon's last two ticks, 15 s apart (ADR 0021): CPU, memory, disk, network rates, gateways included. Through the fleet: with `tenant`, from the tenant's host; without, every host, never partial, with `host` on each"
      parameters:
        - { name: tenant, in: query, schema: { type: string } }
      responses:
        "200": { description: "machines, by tenant then name", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TopMachine" } } } } }
  /v1/events:
    get:
      summary: "What happened on the host, oldest first (ADR 0019): the events after `since`. With `watch=true`, those and then each new event as it is logged, kept open as NDJSON, one event per line, `{}` every 30 s, and a last line `{code, error}` when the watch ends (`lagged`: it fell more than 1,024 events behind; `shutdown`: the daemon goes down); watch again from the last seq received. Through the fleet: with `tenant`, from the tenant's host, else with `machine`, from the machine's host (`x-briqyard-host` names it, the cursor is its seq, a watch is streamed through); with neither, every host, never partial, merged by time with `host` on each event and a cursor `<host>:<seq>,…`; a watch of every host is refused (400)"
      parameters:
        - { name: since, in: query, description: "a previous read's `next`; absent or 0, the oldest kept", schema: { type: string } }
        - { name: tenant, in: query, schema: { type: string } }
        - { name: machine, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [normal, warning] } }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 5000 } }
        - { name: watch, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: a page, or with `watch` a stream
          content:
            application/json: { schema: { $ref: "#/components/schemas/EventsPage" } }
            application/x-ndjson: { schema: { $ref: "#/components/schemas/Event" } }
        "400": { description: "`invalid`: a `since` that is not a cursor, a bad id or type; a fleet-wide watch" }
        "404": { description: "`not_found` (fleet): the tenant or the machine is on no host; a destroyed machine's events are read with its tenant" }
        "410": { description: "`gone`: the events after `since` were removed, or `since` is past the host's last seq (its log began again); `oldest` is the oldest seq kept" }
  /v1/tenants:
    get:
      summary: Tenants on the host (daemon), or tenant to host (fleet)
      responses:
        "200": { description: tenants, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Tenant" } } } } }
  /v1/tenants/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: A tenant, its gateway included
      responses:
        "200": { description: tenant, content: { application/json: { schema: { $ref: "#/components/schemas/Tenant" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove the network of a tenant with no machine left, and its gateway
      responses:
        "204": { description: removed }
        "409": { description: "`tenant_in_use`: the tenant still has machines" }
  /v1/tenants/{id}/gateway:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      parameters:
        - { name: region, in: query, schema: { type: string }, description: "fleet: where to place a tenant that has no host yet" }
      summary: "Make the tenant's gateway (the tenant too, when it has nothing yet), not started unless `start`, or replace its spec: a running one is restarted with it, on the same address, and the spec it has changes nothing (ADR 0016). It is a machine of the daemon named `gateway.internal` in the tenant, absent from `GET /v1/machines`; a machine with `egress: {mode: via, via: gateway}` starts it and waits for its port (its `ready` when it has a startup or readiness probe) before its own boot, and the daemon stops it when no such machine runs or starts"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GatewaySpec" }
      responses:
        "200": { description: the tenant, content: { application/json: { schema: { $ref: "#/components/schemas/Tenant" } } } }
        "400": { description: "`invalid`: no image, no port, a bad size, bad `probes`, or a change of `volume_gb`" }
        "403": { description: "`quota`: the gateway counts as one of the tenant's machines" }
        "409": { description: "`conflict`: a machine named `gateway` exists in the tenant; `boot_failed`: the gateway did not come up (asked with `start`, or replaced while running), the body's `machine` is it, in `error` with its console's last lines" }
    delete:
      summary: Stop and destroy the tenant's gateway; none is success
      responses:
        "204": { description: removed }
        "409": { description: "`gateway_in_use`: a machine of the tenant with `via: gateway` is running or starting" }
  /v1/tenants/{id}/quota:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: The tenant's quota and what it holds (ADR 0025)
      responses:
        "200": { description: quota, content: { application/json: { schema: { $ref: "#/components/schemas/TenantQuota" } } } }
        "404": { description: "`not_found`: the host (through the fleet, any host) has no such tenant" }
    put:
      summary: "Put the tenant's quota, whole (the tenant too, when it has nothing yet). Checked at create, fork, restore and gateway put (machines, disk) and at each start's reservation (memory, vCPUs); a refusal is 403 `quota` and a `quota_exceeded` event. One under the use stops nothing. Through the fleet, to the tenant's host; a tenant with none is placed, in `region`"
      parameters:
        - { name: region, in: query, schema: { type: string }, description: "fleet: where to place a tenant that has no host yet" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Quota" }
      responses:
        "200": { description: quota, content: { application/json: { schema: { $ref: "#/components/schemas/TenantQuota" } } } }
        "503": { description: "`capacity` (fleet): no host (of `region`) takes a new tenant" }
  /v1/tenants/{id}/unpin:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Release a tenant from its host without touching the host (fleet only); its next machine is placed afresh, and the host's next heartbeat pins it again if the tenant still has machines there
      responses:
        "204": { description: released }
  /v1/hosts:
    get:
      summary: Hosts (fleet only)
      responses:
        "200": { description: hosts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Host" } } } } }
    post:
      summary: "Add a server (fleet only, ADR 0028; Kubernetes's `kubeadm join`): recorded `provisioning` with a fresh token, then bootstrapped over SSH and pinned (SSH key, API certificate). The fleet buys no server (ADR 0042)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddHostRequest" }
      responses:
        "202": { description: added, bootstrapped within two minutes, content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "400": { description: "`invalid`: an SSH address that is not one, an API address that is not an IPv4 address, or apart from the SSH address but outside `bootstrap.private_network`" }
        "409": { description: "`conflict`: a host has that id or address; `bootstrap_off`: `bootstrap.enabled` is false" }
  /v1/hosts/register:
    post:
      summary: A daemon's heartbeat (fleet only), with the host's own API token as the bearer, taken for the one host record that expects that token at the daemon's address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterHostRequest" }
      responses:
        "204": { description: recorded }
        "401": { description: not the token the fleet holds for the host at this address }
        "403": { description: no host is expected at this address (`unknown_host`) }
  /v1/hosts/key:
    post:
      summary: "A host's pool key (fleet only, ADR 0026): with the host's own API token as the bearer, for the one host record at the address it advertises; made at the first ask, the same after. With `key_id` and `restore`, the key of that id, a live or forgotten host's: the key a backup is encrypted under, served once for a restore the fleet forwarded to this host (ADR 0035)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostKeyRequest" }
      responses:
        "200": { description: the key, content: { application/json: { schema: { $ref: "#/components/schemas/HostKey" } } } }
        "401": { description: not the token the fleet holds for the host at this address }
        "403": { description: "no host is expected at this address (`unknown_host`); with `key_id`, no restore open for this host as named (`no_restore`)" }
        "404": { description: "with `key_id`: the fleet holds no pool key of that id (`no_key`)" }
        "500": { description: the registry could not be written (`registry`); no key is handed out unwritten }
        "503": { description: "the registry's backup could not be written (`backup`, ADR 0032); no key is handed out before the backup holds it" }
  /v1/hosts/{id}/retire:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Take no new tenant on a host and forget it once nothing runs on it (fleet only); the server is the operator's to give back
      responses:
        "200": { description: "`retiring`, or `retired` (forgotten) when it was already empty", content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "409": { description: the host is upgrading (`conflict`) }
  /v1/hosts/{id}/drain:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Take no new tenant on this host, and keep it (fleet only; Kubernetes's cordon)
      responses:
        "204": { description: draining }
        "409": { description: the host is upgrading (`conflict`) }
  /v1/hosts/{id}/undrain:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Take new tenants on a draining or retiring host again (fleet only)
      responses:
        "204": { description: ready }
        "409": { description: "the host is neither draining nor retiring (`conflict`)" }
  /v1/hosts/{id}/upgrade:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: "Install another release on a ready or draining host, its machines running (fleet only, ADR 0027): the host `upgrading`, `hack/bootstrap-host.sh` run over SSH with the release, the daemon handing its machines over to the new one, then a heartbeat from a new start of the installed version that stopped no machine; the host back in its state. Answers when it is done; one upgrade at a time"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpgradeHostRequest" }
      responses:
        "200": { description: "upgraded; the note says to what and how many machines were handed over", content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "400": { description: "a release that is neither a URL nor a version, or no SSH key (`bootstrap.ssh_key`)" }
        "404": { description: no such host }
        "409": { description: "another upgrade under way, or the host is neither ready nor draining (`conflict`)" }
        "502": { description: "the upgrade failed (`upgrade_failed`): the host is `draining`, the reason in its note" }
  /v1/hosts/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    delete:
      summary: "Forget a host (fleet only). A host whose record holds a pool key is refused unless `force`: the key goes with the record (ADR 0026)"
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false }, description: "forget a host that holds a pool key: its pool is unreadable at its next restart" }
      responses:
        "204": { description: forgotten }
        "409": { description: "the host holds a pool key (`pool_key`): retire it, or force" }
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    snap:
      name: snap
      in: path
      required: true
      description: a snapshot's id or name
      schema: { type: string }
    ifMatch:
      name: If-Match
      in: header
      description: "the machine's `version` as last read (ADR 0019): the call is refused with 409 `conflict` when it moved since. Absent: no condition"
      schema: { type: integer }
  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Moved:
      description: "`conflict`: `If-Match` names a version the machine moved past; the body's `machine` is it as it is"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    Size:
      type: object
      required: [vcpus, memory_mb]
      properties:
        vcpus: { type: integer, minimum: 1, maximum: 32 }
        memory_mb: { type: integer, minimum: 128, maximum: 262144 }
    VolumeSpec:
      type: object
      required: [size_gb, mount]
      properties:
        size_gb: { type: integer, minimum: 1 }
        mount: { type: string, description: absolute path in the machine }
    VolumeSize:
      type: object
      required: [size_gb]
      additionalProperties: false
      properties:
        size_gb: { type: integer, minimum: 1 }
    File:
      type: object
      required: [path, base64]
      properties:
        path: { type: string }
        base64: { type: string }
        mode: { type: string, description: octal digits, default "0644" }
    RestartPolicy:
      type: object
      properties:
        policy: { type: string, enum: ["no", on-failure, always], default: on-failure }
        max_retries: { type: integer, default: 3 }
    RestoreSpec:
      type: object
      required: [machine_id]
      properties:
        machine_id: { type: string, description: the backed-up machine; it may no longer exist }
        backup: { type: string, description: a backup id, or "latest" (the default) }
    BackupPolicy:
      type: object
      required: [every, keep]
      description: "a backup every `every`, the newest `keep` kept with what they continue from (ADR 0023); a refusal names the field (`backup.every`, `backup.keep`)"
      properties:
        every: { type: string, description: '"6h", "1d": at least 1h' }
        keep: { type: integer, minimum: 1 }
    Backup:
      type: object
      properties:
        id: { type: string, description: "a timestamp to the millisecond (20261021T101500.123Z), later ids sort later" }
        machine_id: { type: string }
        tenant: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        bytes: { type: integer }
        incremental: { type: boolean }
        disks:
          type: array
          items:
            type: object
            properties:
              disk: { type: string, enum: [root, data] }
              key: { type: string }
              bytes: { type: integer }
              from: { type: string, description: the backup this stream continues from }
        key_id: { type: string, description: "the id of the pool key the streams are encrypted under (raw sends, ADR 0035): a hash, never the key; absent: streams in clear, made before ADR 0035" }
        deletes_at: { type: string, format: date-time, description: "a destroyed machine's backup: when the host deletes it (`backup.keep_destroyed_days` after the destroy)" }
    ForkSpec:
      type: object
      required: [machine_id]
      properties:
        machine_id: { type: string }
        copy: { type: string, enum: [disk, config], default: disk }
    Egress:
      type: object
      description: "where the machine's traffic may go, enforced on the host (ADR 0015); a refusal names the field"
      properties:
        mode: { type: string, enum: [open, via, none], default: open, description: "open: its tenant and the internet; via: only the `via` machine (any port) and its gateway's DNS; none: its tenant, no internet. Under via and none, DNS answers internal names only (NXDOMAIN for the rest)" }
        via: { type: string, description: "for `via` only: a machine of the same tenant, not this one, or `gateway`: the tenant's gateway, started before this machine and kept running while it runs" }
    EgressLimits:
      type: object
      description: "limits on the machine's internet traffic, through the host's NAT, enforced on the host (ADR 0018); `via` and `none` machines never reach it. In a request an absent field keeps the machine's value (on create, the host's `egress_limits`); in a machine, every field is there: the values in force"
      properties:
        blocked_ports: { type: array, items: { type: integer, minimum: 1, maximum: 65535 }, description: "destination ports refused, TCP (reset) and UDP (ICMP port unreachable); `[]` refuses none. Host default: [25]" }
        new_connections_per_minute: { type: integer, minimum: 0, description: "new connections a minute, as many at once; over it, dropped. 0: no limit" }
        bandwidth_mbit: { type: integer, minimum: 0, maximum: 100000, description: "Mbit/s, in and out together; over it, dropped. 0: no limit" }
    DiskLimits:
      type: object
      description: "limits on each of the machine's disks, the root disk and the volume, by Firecracker's rate limiter (ADR 0030); over them the guest's requests wait. In a request an absent field keeps the machine's value (on create, the host's `disk_limits` for its size: a rate per vCPU); in a machine, every field is there: the values in force"
      properties:
        bandwidth_mb: { type: integer, minimum: 0, maximum: 100000, description: "MB (2^20 bytes) a second, reads and writes together. 0: no limit. Host default: 32 per vCPU" }
        iops: { type: integer, minimum: 0, maximum: 10000000, description: "requests a second (reads, writes, flushes). 0: no limit. Host default: 4000 per vCPU" }
        burst_sec: { type: integer, minimum: 0, maximum: 3600, description: "what each limit lets through at full speed once after a start, a wake or a change, in seconds at its rate. Host default: 10" }
    EgressDrops:
      type: object
      description: packets the machine's limits dropped since it started (or the daemon did), read every 15 s
      properties:
        blocked_port: { type: integer }
        rate: { type: integer }
        bandwidth: { type: integer }
    CreateMachineRequest:
      type: object
      required: [tenant, name, size]
      properties:
        tenant: { type: string, description: "owns the machine and its network: a-z, 0-9, _ and -, at most 64 characters" }
        name: { type: string, description: a DNS label, unique in the tenant; `<name>.internal` resolves to the machine }
        image: { type: string, description: an OCI reference; required unless `fork` is set }
        entrypoint: { type: array, items: { type: string } }
        cmd: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        files: { type: array, items: { $ref: "#/components/schemas/File" } }
        size: { $ref: "#/components/schemas/Size" }
        volume: { $ref: "#/components/schemas/VolumeSpec" }
        ports: { type: array, items: { type: integer } }
        sleep: { type: string, description: '"30m", "2h", "7d" or "never"; stops the machine after that long without use' }
        restart: { $ref: "#/components/schemas/RestartPolicy" }
        metadata: { type: object, additionalProperties: { type: string }, description: "kept as is; the labels `?label=` selects on" }
        region: { type: string, description: "fleet: a new tenant is placed on a host of this region (a host's `region`); a tenant's machines stay in its host's (ADR 0025). Absent: any. A daemon ignores it" }
        egress: { allOf: [{ $ref: "#/components/schemas/Egress" }], description: "absent: open, or for a restore the backup's" }
        limits: { allOf: [{ $ref: "#/components/schemas/EgressLimits" }], description: "over the host's, field by field; absent: the host's, or for a restore the backup's" }
        disk_limits: { allOf: [{ $ref: "#/components/schemas/DiskLimits" }], description: "over the host's for its size, field by field; absent: the host's, or for a restore the backup's" }
        backup: { oneOf: [{ $ref: "#/components/schemas/BackupPolicy" }, { type: "null" }], description: "absent: the host's `backup.default_every` and `default_keep` (none unless configured); null: none. A restore or a fork takes this, not its source's" }
        probes: { allOf: [{ $ref: "#/components/schemas/Probes" }], description: "absent: none, or for a restore the backup's" }
        start: { type: boolean, default: true, description: "the answer comes at `running`, not `ready`: `/wait` for that" }
        fork: { $ref: "#/components/schemas/ForkSpec" }
        restore: { $ref: "#/components/schemas/RestoreSpec" }
    Exit:
      type: object
      properties:
        code: { type: integer }
        oom_killed: { type: boolean }
        at: { type: string, format: date-time }
        restarting: { type: boolean }
    Machine:
      type: object
      properties:
        id: { type: string }
        tenant: { type: string }
        name: { type: string }
        image: { type: string }
        image_digest: { type: string }
        state: { type: string, enum: [created, starting, running, stopping, stopped, destroying, error] }
        stopped_reason: { type: string, enum: [user, idle, exit, host], description: "why it is stopped: asked, the sleep window ran out, its process ended, or the daemon stopped it (a shutdown, a leftover of a crashed daemon; wakeable like idle)" }
        exit: { $ref: "#/components/schemas/Exit" }
        error: { type: string }
        ip: { type: string }
        hostname: { type: string, description: "`<name>.internal`, follows the name" }
        machine_host: { type: string, description: "`<id>.vm.internal`, this exact machine" }
        size: { $ref: "#/components/schemas/Size" }
        volume: { $ref: "#/components/schemas/VolumeSpec" }
        ports: { type: array, items: { type: integer } }
        sleep: { type: string }
        restart: { $ref: "#/components/schemas/RestartPolicy" }
        restarts: { type: integer, description: "restarts in a row by the restart policy; reset by an exit it does not restart" }
        restarting_at: { type: string, format: date-time, description: "while `stopped (exit)` and waiting for its restart: when it starts again (10 s doubling to 5 minutes, reset by a run of 10 minutes)" }
        ready: { type: boolean, description: "running and serving: true at once without a startup or readiness probe, else once they passed; false whenever it is not running" }
        probes: { $ref: "#/components/schemas/Probes" }
        probes_status: { $ref: "#/components/schemas/ProbesStatus" }
        egress: { $ref: "#/components/schemas/Egress" }
        limits: { $ref: "#/components/schemas/EgressLimits" }
        egress_drops: { $ref: "#/components/schemas/EgressDrops" }
        disk_limits: { $ref: "#/components/schemas/DiskLimits" }
        metadata: { type: object, additionalProperties: { type: string } }
        endpoints: { type: array, items: { $ref: "#/components/schemas/Endpoint" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: moves on every write, a touch included }
        state_changed_at: { type: string, format: date-time, description: moves only when `state` does }
        started_at: { type: string, format: date-time }
        stopped_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        sleeps_at: { type: string, format: date-time, description: when it stops if nothing uses it }
        backup: { $ref: "#/components/schemas/BackupPolicy" }
        last_backup_at: { type: string, format: date-time, description: when its newest backup in the store was made }
        next_backup_at: { type: string, format: date-time, description: "when the daemon backs it up next: `every` after the last backup, 15 minutes after a failed one; a machine with no process whose disks wrote nothing is not backed up again and its time moves on" }
        version: { type: integer, description: "the seq of the last event about it: every event moves it, its last use does not; what `If-Match` compares" }
        pending: { $ref: "#/components/schemas/Pending" }
        pending_since: { type: string, format: date-time, description: "when the oldest change still pending was made" }
        init_version: { type: string, description: "what the init in its root disk said at its last boot (ADR 0027); empty before it, or from an init older than the report" }
        vmm_version: { type: string, description: "what ran its last boot: Firecracker's version and the host kernel's release, `v1.17.0/6.8.0-45-generic`; a memory snapshot resumes only under the same" }
        host: { type: string, description: the host that runs it (fleet) }
    Endpoint:
      type: object
      properties:
        id: { type: string }
        machine_id: { type: string }
        port: { type: integer }
        protocol: { type: string, enum: [tcp, http] }
        host_port: { type: integer }
        host: { type: string }
        address: { type: string, description: '"<ip>:<host_port>" or "http://<host>"' }
        created_at: { type: string, format: date-time }
    CreateEndpointRequest:
      type: object
      required: [port]
      properties:
        port: { type: integer }
        protocol: { type: string, enum: [tcp, http], default: tcp }
        host: { type: string, description: the label before the domain, for http }
    ExecRequest:
      type: object
      required: [cmd]
      properties:
        cmd: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        cwd: { type: string }
        stdin: { type: string }
        timeout_ms: { type: integer, default: 300000, maximum: 3600000 }
        wake: { type: boolean, default: true, description: Wake a sleeping machine for the command; false answers 409 when it is not running }
    SessionEnd:
      type: object
      description: "the last message of a session (channel 3): how the command ended (`exit_code`, `timed_out` when its deadline ended it), or, with `code` and no `exit_code`, why the session ended without it (`not_running`: the machine went down; `invalid`: a message the server could not read; `internal`)"
      properties:
        exit_code: { type: integer }
        timed_out: { type: boolean }
        code: { type: string }
        error: { type: string }
    Resize:
      type: object
      required: [cols, rows]
      properties:
        cols: { type: integer }
        rows: { type: integer }
    ExecResult:
      type: object
      properties:
        stdout: { type: string }
        stderr: { type: string }
        exit_code: { type: integer }
        timed_out: { type: boolean }
    PutFileRequest:
      type: object
      required: [path, base64]
      properties:
        path: { type: string }
        base64: { type: string }
        mode: { type: string }
    FileResponse:
      type: object
      properties:
        path: { type: string }
        base64: { type: string }
    LogLine:
      type: object
      properties:
        ts: { type: string, format: date-time }
        line: { type: string }
    LogsResponse:
      type: object
      properties:
        lines: { type: array, items: { $ref: "#/components/schemas/LogLine" } }
        next: { type: string }
    UpdateMachineRequest:
      type: object
      properties:
        sleep: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        egress: { allOf: [{ $ref: "#/components/schemas/Egress" }], description: "absent keeps the current one" }
        limits: { allOf: [{ $ref: "#/components/schemas/EgressLimits" }], description: "the fields it names change, the others stay" }
        disk_limits: { allOf: [{ $ref: "#/components/schemas/DiskLimits" }], description: "the fields it names change, the others stay; a running machine's disks take them at once (their buckets full again)" }
        backup: { oneOf: [{ $ref: "#/components/schemas/BackupPolicy" }, { type: "null" }], description: "absent keeps it, null removes it; the next time is `every` after the last backup" }
        probes: { allOf: [{ $ref: "#/components/schemas/Probes" }], description: "replaces them all; a running machine's start over at once, `ready` as at a boot" }
        image: { type: string, description: "at the next start: pulled and built then (a failure is `boot_failed`, the change still pending), the root disk made again from it, the data volume kept" }
        entrypoint: { type: array, items: { type: string }, description: at the next start }
        cmd: { type: array, items: { type: string }, description: at the next start }
        env: { type: object, additionalProperties: { type: string }, description: "the whole env, at the next start; write-only" }
        files: { type: array, items: { $ref: "#/components/schemas/File" }, description: "all the boot files, at the next start; write-only" }
        size: { allOf: [{ $ref: "#/components/schemas/Size" }], description: "at the next start, reserved then: 503 `capacity` past the host's memory" }
        ports: { type: array, items: { type: integer }, description: at the next start }
        restart: { allOf: [{ $ref: "#/components/schemas/RestartPolicy" }], description: at the next start }
        volume: { allOf: [{ $ref: "#/components/schemas/VolumeSize" }], description: "larger than it is (the same size is no change): the disk grows at once, the tenant's quota and the pool's free space checked as at a create; the guest's filesystem grows at the next start, which is cold (ADR 0040)" }
    Pending:
      type: object
      description: "what the next start applies (ADR 0024); a change to the image, entrypoint, command, env, files, size or volume also makes that start cold, its memory snapshot dropped"
      properties:
        fields: { type: array, items: { type: string, enum: [image, entrypoint, cmd, env, files, size, ports, restart, volume] } }
        image: { type: string }
        size: { $ref: "#/components/schemas/Size" }
        ports: { type: array, items: { type: integer } }
        restart: { $ref: "#/components/schemas/RestartPolicy" }
        volume: { allOf: [{ $ref: "#/components/schemas/VolumeSize" }], description: "the size its disk has already; the guest's filesystem grows to it at the next start (ADR 0040)" }
    Probe:
      type: object
      description: "a check the daemon runs on a running machine (ADR 0022): exactly one of `exec`, `tcp` and `http`. Not a use: it never postpones sleep"
      properties:
        exec: { type: array, items: { type: string }, minItems: 1, description: "run in the machine through its init; exit 0 passes" }
        tcp: { type: integer, minimum: 1, maximum: 65535, description: "a connect from the host to this port of the machine's address" }
        http: { $ref: "#/components/schemas/HttpProbe" }
        period_sec: { type: integer, minimum: 1, default: 10 }
        timeout_sec: { type: integer, minimum: 1, default: 5, description: "for one execution, counted once it holds its turn (32 at once per host)" }
        failure_threshold: { type: integer, minimum: 1, default: 3, description: failures in a row that fail it }
        success_threshold: { type: integer, minimum: 1, default: 1, description: "passes in a row that pass it; must be 1 for startup and liveness" }
        initial_delay_sec: { type: integer, minimum: 0, default: 0, description: "from when it may run: the boot, or the startup probe's pass" }
    HttpProbe:
      type: object
      required: [port]
      properties:
        port: { type: integer, minimum: 1, maximum: 65535 }
        path: { type: string, default: /, description: "a GET from the host; 200 to 399 passes" }
    Probes:
      type: object
      description: "startup runs first and gates the others; readiness sets `ready`; liveness failures end the process, a failure for the restart policy. A startup failure on a run a caller asked for (create, start, wake) fails the boot: `error`, no restart; on a run the restart policy started, it is a crash like a liveness failure"
      properties:
        startup: { $ref: "#/components/schemas/Probe" }
        readiness: { $ref: "#/components/schemas/Probe" }
        liveness: { $ref: "#/components/schemas/Probe" }
    ProbeStatus:
      type: object
      properties:
        passed: { type: boolean, description: the last execution passed }
        message: { type: string, description: "what it answered: `exit 1: …`, `HTTP 503`, a connect error" }
        failures: { type: integer, description: failures in a row }
        at: { type: string, format: date-time }
    ProbesStatus:
      type: object
      description: each probe's last result in the current run, in memory (a daemon restart runs them again); absent before its first execution
      properties:
        startup: { $ref: "#/components/schemas/ProbeStatus" }
        readiness: { $ref: "#/components/schemas/ProbeStatus" }
        liveness: { $ref: "#/components/schemas/ProbeStatus" }
    StopRequest:
      type: object
      properties:
        suspend: { type: boolean, description: keep a memory snapshot so the next start resumes in well under a second; a plain stop when Firecracker refuses }
        timeout_sec: { type: integer, default: 10, maximum: 600 }
    SnapshotRequest:
      type: object
      properties:
        name: { type: string, description: "to find it by again: a-z, 0-9, _ and -, at most 64, not starting with s_; unique on the machine" }
        memory: { type: boolean, description: "its memory too, on a running machine, paused while it is written: a restore resumes its processes where they were" }
    Snapshot:
      type: object
      properties:
        id: { type: string }
        machine_id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        disks: { type: array, items: { type: string, enum: [root, data] }, description: "the disks it holds; a new image drops root (ADR 0024)" }
        memory: { type: boolean, description: "it holds the memory: a restore resumes, unless the image, command, env, files or size changed since" }
    MachineStats:
      type: object
      properties:
        state: { type: string }
        cpu_usec: { type: integer }
        memory_bytes: { type: integer }
        uptime_sec: { type: integer }
        disk_bytes: { type: integer }
    Image:
      type: object
      properties:
        key: { type: string }
        ref: { type: string }
        digest: { type: string }
        size_gb: { type: integer }
        built_at: { type: string, format: date-time }
        machines: { type: integer }
    Tenant:
      type: object
      properties:
        id: { type: string }
        subnet: { type: string }
        router: { type: string, description: "the host's address on the tenant's network (`.1`): the machines' route and DNS" }
        machines: { type: integer, description: the tenant's machines, its gateway not counted }
        created_at: { type: string, format: date-time }
        host: { type: string, description: The host the tenant lives on (fleet) }
        region: { type: string, description: "its host's region (fleet): the tenant's" }
        gateway: { $ref: "#/components/schemas/GatewayView" }
    Quota:
      type: object
      description: "a limit left out is no limit; no quota is none (the daemon has no defaults)"
      properties:
        machines: { type: integer, minimum: 0, description: "machines, its gateway included" }
        memory_mb: { type: integer, minimum: 0, description: "of its machines starting, running or stopping" }
        vcpus: { type: integer, minimum: 0, description: of the same }
        disk_gb: { type: integer, minimum: 0, description: "the volumes' sizes" }
    TenantQuota:
      type: object
      required: [tenant, quota, used]
      properties:
        tenant: { type: string }
        quota: { $ref: "#/components/schemas/Quota" }
        used:
          type: object
          required: [machines, memory_mb, vcpus, disk_gb]
          properties:
            machines: { type: integer }
            memory_mb: { type: integer }
            vcpus: { type: integer }
            disk_gb: { type: integer }
    GatewaySpec:
      type: object
      required: [image, port]
      properties:
        image: { type: string }
        cmd: { type: array, items: { type: string }, description: replaces the image's command }
        env: { type: object, additionalProperties: { type: string }, description: write-only, as a machine's }
        files: { type: array, items: { $ref: "#/components/schemas/File" }, description: "boot files, as a machine's (a proxy's configuration, its CA); write-only" }
        size: { allOf: [{ $ref: "#/components/schemas/Size" }], description: "default 1 vCPU, 256 MB" }
        port: { type: integer, minimum: 1, maximum: 65535, description: "the port its program listens on: a start waits for it, within `boot_timeout_sec`" }
        volume_gb: { type: integer, minimum: 1, description: "a data volume at `/data`, fixed for the gateway's life" }
        probes: { allOf: [{ $ref: "#/components/schemas/Probes" }], description: "as a machine's; with a startup or readiness probe, a start that needs the gateway waits for its `ready`, not its port" }
        start: { type: boolean, default: false, description: "start it now and answer once its port accepts (or it is ready); a running one is left as is. Nothing then keeps it running: the daemon stops it until a `via: gateway` machine starts" }
    GatewayView:
      type: object
      properties:
        state: { type: string, enum: [created, starting, running, stopping, stopped, destroying, error] }
        ip: { type: string }
        port: { type: integer }
        machine_id: { type: string, description: "`GET /v1/machines/{id}` and its `/logs` answer for it" }
        error: { type: string, description: why it last failed to come up }
    Capacity:
      type: object
      properties:
        memory_mb: { type: integer }
        vcpus: { type: integer }
    UsageBucket:
      type: object
      description: One machine in one UTC hour. GB is 2^30 bytes.
      properties:
        hour: { type: string, format: date-time, description: the hour's start }
        machine_id: { type: string }
        tenant: { type: string }
        role: { type: string, enum: [gateway], description: "the tenant's gateway (ADR 0016); absent for the tenant's machines" }
        metadata: { type: object, additionalProperties: { type: string }, description: as last in the hour }
        size: { $ref: "#/components/schemas/Size" }
        running_seconds: { type: number, description: "with a process: `starting`, `running`, `stopping`" }
        suspended_seconds: { type: number, description: stopped with a memory snapshot }
        cpu_seconds: { type: number, description: "CPU time of the machine's cgroup (jailed hosts)" }
        memory_mb_seconds: { type: number, description: "`size.memory_mb` × running seconds: reserved" }
        root_gb_hours: { type: number, description: "the root disk's allocated size × hours" }
        volume_gb_hours: { type: number, description: "the data volume's allocated size × hours" }
        disk_used_gb_hours: { type: number, description: what the disks take on the pool × hours }
        snapshot_gb_hours: { type: number, description: "local snapshots, retired disks and memory snapshots included, × hours" }
        backup_gb_hours: { type: number, description: "the machine's backups in the object store × hours; a destroyed machine's go on in its buckets until they are deleted (ADR 0023)" }
        internet_out_bytes: { type: integer, description: "to the internet, through the host's NAT" }
        internet_in_bytes: { type: integer }
        ingress_out_bytes: { type: integer, description: "to clients of the machine's endpoints" }
        ingress_in_bytes: { type: integer }
        egress_dropped_packets: { type: integer, description: "packets the machine's egress limits dropped (ADR 0018)" }
        closed: { type: boolean, description: "the hour is over: the bucket will not change again" }
        host: { type: string, description: the host that measured it (fleet) }
    Event:
      type: object
      required: [seq, at, type, reason, message]
      properties:
        seq: { type: integer, description: one more per event on its host, never reused }
        at: { type: string, format: date-time }
        type: { type: string, enum: [normal, warning] }
        reason: { type: string, enum: [created, forked, restored, starting, started, resumed, ready, not_ready, stopping, stopped, suspended, exited, restarting, crash_loop, liveness_failed, startup_failed, boot_failed, start_failed, updated, applied, egress_changed, backed_up, backup_failed, backup_deleted, snapshot_taken, snapshot_deleted, destroyed, gateway_started, gateway_stopped, image_pulled, host_started, adopted, host_condition, image_removed, quota_exceeded, session_opened], description: "ADR 0019's table says when each happens, ADR 0021's for the host's conditions and images, ADR 0022's for the probes and `crash_loop`, ADR 0023's for backups, ADR 0024's for `applied`, ADR 0025's for `quota_exceeded`, ADR 0029's for `session_opened`, ADR 0031's for snapshots and a restore to one" }
        message: { type: string, description: for a person; at most 1 KB }
        machine_id: { type: string }
        tenant: { type: string }
        host: { type: string, description: "the host it happened on (fleet-wide reads)" }
        data: { type: object, description: "the reason's facts: `code`, `oom` for `exited`, `reason` for `stopped`…" }
    EventsPage:
      type: object
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        next: { type: string, description: "the `since` to read on from: the last event returned when the page is full, else the host's last seq; through the fleet without a tenant or machine, `<host>:<seq>,…`" }
    Status:
      type: object
      properties:
        version: { type: string, description: "this build: the release and its commit, `0.1.0+fdad892eeefa` (ADR 0027)" }
        host_id: { type: string }
        capacity: { $ref: "#/components/schemas/Capacity" }
        used: { $ref: "#/components/schemas/Capacity" }
        machines: { type: integer, description: the tenants' machines, gateways not counted }
        running: { type: integer, description: machines up on the host, gateways included }
        disk_free_mb: { type: integer }
        tls_fingerprint: { type: string, description: "SHA-256 of the API's certificate, 64 hex digits; empty on plain HTTP (ADR 0020)" }
        conditions: { type: array, items: { $ref: "#/components/schemas/Condition" } }
        started: { $ref: "#/components/schemas/DaemonStart" }
        vmm_version: { type: string, description: "what a machine booted now runs under: Firecracker's version and the host kernel's release" }
        regions: { type: array, items: { $ref: "#/components/schemas/RegionRoom" }, description: "fleet only: each region's room and the creates refused for want of it (ADR 0042)" }
    RegionRoom:
      type: object
      description: "A region as the fleet sees it (ADR 0042): its hosts that take a new tenant (ready, under the fill ceiling, no condition), and its refusals"
      properties:
        region: { type: string, description: "a host's region; empty for none; `other` counts refusals in a region no host is in" }
        free: { $ref: "#/components/schemas/Room", description: "absent for a region no host is in (refusals only)" }
        largest_slot: { $ref: "#/components/schemas/Room", description: "absent as `free` is" }
        unschedulable:
          type: object
          description: "creates refused 503 `capacity` since the fleet started, by what ran out"
          properties:
            memory: { type: integer, description: "no host of the region had the memory free under its fill ceiling, or those with the room are under memory_pressure: a new host fixes it" }
            disk: { type: integer, description: "hosts had the memory, none the disk (a volume plus 2 GB), or those with the room are under disk_pressure: a new host fixes it" }
            pressure: { type: integer, description: "the host the create is bound to (the tenant's, a fork's source's) is under a condition: that host must be freed" }
    Room:
      type: object
      description: "memory and disk, in MB: summed over the hosts (`free`), or the most on one (`largest_slot`)"
      properties:
        memory_mb: { type: integer }
        disk_mb: { type: integer }
    DaemonStart:
      type: object
      description: "When the daemon started and what it did with the machines the previous one left running (ADR 0027); absent from a daemon older than that"
      properties:
        at: { type: string, format: date-time }
        adopted: { type: integer, description: left running and taken over }
        stopped: { type: integer, description: "left running, its process still there but not taken over: ended, marked stopped, booted again when its sleep window had not run out; what fails an upgrade" }
        gone: { type: integer, description: "left running, its process ended while no daemon ran: marked stopped, booted again the same way" }
    UpgradeHostRequest:
      type: object
      required: [release]
      properties:
        release: { type: string, description: "a URL where `<binary>-linux-<arch>` are, or a version of the project's releases (`0.2.0`, `v0.2.0`)" }
    Condition:
      type: object
      description: "A host condition (ADR 0021), decided by the daemon's tick. Each is a pressure: the fleet places nothing new on a host while one is true"
      required: [type, status, since, message]
      properties:
        type: { type: string, enum: [memory_pressure, disk_pressure], description: "`memory_pressure`: committed memory over `conditions.memory_pct` of capacity; `disk_pressure`: the pool's free space under `conditions.disk_free_pct` of its size" }
        status: { type: boolean }
        since: { type: string, format: date-time, description: "when `status` last changed; the daemon's start until it does" }
        message: { type: string, description: the figures it was decided on }
    TopMachine:
      type: object
      properties:
        machine_id: { type: string }
        tenant: { type: string }
        name: { type: string }
        role: { type: string, enum: [gateway], description: "the tenant's gateway; absent for the tenant's machines" }
        cpu_percent: { type: number, description: "CPU time over the window, in percent of one CPU (jailed hosts)" }
        memory_bytes: { type: integer, description: "what its process holds, from its cgroup (jailed hosts)" }
        memory_limit_bytes: { type: integer, description: its size's memory }
        disk_used_bytes: { type: integer, description: "its disks, their snapshots, the disks a restore retired and its memory snapshots on the pool" }
        internet_in_bytes_per_sec: { type: number }
        internet_out_bytes_per_sec: { type: number }
        ingress_in_bytes_per_sec: { type: number }
        ingress_out_bytes_per_sec: { type: number }
        window_sec: { type: number, description: "the seconds between the two measures; 0 until there are two, with every rate 0" }
        host: { type: string, description: the host it runs on (fleet) }
    Host:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        ssh: { type: string, description: "where the fleet reaches the server over SSH, when not at the API's address (its API on the private network); absent otherwise" }
        region: { type: string }
        provider: { type: string, description: "how the host came: `static` (the fleet's `hosts:`) or `manual` (`POST /v1/hosts`)" }
        state: { type: string, enum: [ready, draining, retiring, upgrading, down, provisioning, bootstrapped, failed, retired], description: "`draining` takes no new tenant; `retiring` neither, and is forgotten once empty (`retired` in the answer to the retire that forgets it); `upgrading` while `host upgrade` runs" }
        capacity: { $ref: "#/components/schemas/Capacity" }
        used: { $ref: "#/components/schemas/Capacity" }
        machines: { type: integer }
        tenants: { type: array, items: { type: string } }
        last_seen: { type: string, format: date-time }
        version: { type: string }
        note: { type: string, description: What the bootstrap or the last upgrade said }
        tls_fingerprint: { type: string, description: "SHA-256 of the host's API certificate, pinned by the fleet; empty on plain HTTP" }
        public_tcp_ports: { type: array, items: { type: integer }, description: "ports its public interface takes besides SSH, from its bootstrap (ADR 0028); absent: none" }
        conditions: { type: array, items: { $ref: "#/components/schemas/Condition" }, description: from its last heartbeat }
        started: { $ref: "#/components/schemas/DaemonStart" }
    AddHostRequest:
      type: object
      required: [ssh]
      properties:
        ssh: { type: string, description: "the server's SSH address (its public one)" }
        address: { type: string, description: "the API's IPv4 address, on the fleet's private network when it has one (the vRack address); default: `ssh`" }
        region: { type: string }
        id: { type: string, description: "default: `h_` and the address, dots as dashes" }
        public_tcp_ports: { type: array, items: { type: integer }, description: "ports its public interface takes besides SSH, and its machines reach on it (an edge's on the host); absent: the fleet's `bootstrap.public_tcp_ports`, empty: none. Kept on the host for every later bootstrap" }
    RegisterHostRequest:
      type: object
      required: [id, url, capacity, used, machines]
      properties:
        id: { type: string, description: The daemon's own id, for the fleet's log; the fleet keeps the host under its own }
        url: { type: string }
        region: { type: string }
        capacity: { $ref: "#/components/schemas/Capacity" }
        used: { $ref: "#/components/schemas/Capacity" }
        machines: { type: integer }
        tenants: { type: array, items: { type: string } }
        version: { type: string }
        disk_free_mb: { type: integer }
        tls_fingerprint: { type: string, description: "SHA-256 of the API's certificate; a fingerprint other than the pinned one is refused (403 tls_mismatch)" }
        conditions: { type: array, items: { $ref: "#/components/schemas/Condition" } }
        started: { $ref: "#/components/schemas/DaemonStart" }
    HostKeyRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "The URL the host advertises (`fleet.advertise`): the fleet finds the host's record by its address" }
        key_id: { type: string, description: "a backup's `key_id`: the key of that id instead of the host's own (ADR 0035)" }
        restore: { $ref: "#/components/schemas/RestoreSpec", description: "with `key_id`: the restore the key is for, as the fleet forwarded it to this host; served once" }
    HostKey:
      type: object
      required: [key]
      properties:
        key: { type: string, description: "The pool's key: 32 bytes as 64 hex digits, ZFS's `hex` key format" }
    ApiError:
      type: object
      properties:
        error: { type: string }
        code: { type: string, enum: [invalid, not_found, conflict, not_running, not_ready, bad_state, boot_failed, capacity, quota, tenant_in_use, gateway_in_use, gateway, gone, unauthorized, unknown_host, tls_mismatch, host_unreachable, host_down, registry, pool_key, backup, internal, timeout] }
        request_id: { type: string }
        machine:
          allOf: [{ $ref: "#/components/schemas/Machine" }]
          description: "with `boot_failed`, the machine left in state `error`; with `conflict` on a stale `If-Match`, the machine as it is"
        oldest: { type: integer, description: "with `gone`: the oldest event seq kept" }
