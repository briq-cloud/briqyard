# briqyardd configuration for the development VM.
listen: 0.0.0.0:7420
data_dir: /var/lib/briqyard
firecracker: /usr/local/bin/firecracker
jailer: /usr/local/bin/jailer
kernel: /var/lib/briqyard/vmlinux
init: /usr/local/bin/briqyard-init
root_disk_gb: 8
storage:
  backend: zfs
  pool: byard
network:
  range: 10.64.0.0/10
ingress:
  tcp_ports: 20000-29999
  http: 0.0.0.0:8080
  domain: byard.localhost
  bind: 0.0.0.0
  # The Mac's side of Lima's NAT. Lima's port forwards arrive on the VM's loopback, which
  # always may connect.
  allowed_clients: [192.168.64.0/24]
  # Lima forwards the VM's ports to the Mac's loopback; the VM's own address is not routable
  # from there. So a router on the Mac dials endpoints at 127.0.0.1.
  advertise: 127.0.0.1
# Backups to a directory on the host: the e2e suite backs a machine up and restores it.
backup:
  store: file:///var/lib/briqyard/backups
capacity:
  memory_mb: 12288
  vcpus: 24
