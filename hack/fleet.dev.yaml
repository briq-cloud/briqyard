# briqyard-fleet configuration for the development VM: one static host, the local daemon.
listen: 0.0.0.0:7430
state_dir: /var/lib/briqyard-fleet
hosts:
  - id: local
    url: http://127.0.0.1:7420
    region: dev
  # The second VM of docs/DEVELOPMENT.md ("Two hosts on the Mac"): the fleet forwards to it
  # with this token and takes its heartbeats with it (a host nobody expects is refused).
  # - id: fc2
  #   url: http://192.168.64.1:27420
  #   token: fc2-token
  #   region: dev
placement:
  fill_ceiling: 0.85
  down_after_sec: 60
# A dry-run Scaleway provisioner: `briqyard host order` records what it would order and makes
# nothing; `briqyard host retire` releases it the same way.
provisioner:
  kind: scaleway
  enabled: false
  dry_run: true
  min_hosts: 1
  max_hosts: 3
  slot_mb: 8192
  idle_grace: 2h
  # The same with OVHcloud (`kind: ovh`): an Eco or Bare Metal plan in a data center, the
  # account's SSH key installed with Ubuntu; credentials from OVH_APPLICATION_KEY,
  # OVH_APPLICATION_SECRET and OVH_CONSUMER_KEY. See docs/OPERATIONS.md.
  # ovh:
  #   plan_code: 25risem01-v2
  #   range: eco
  #   datacenter: gra
  #   ssh_key_name: fleet
