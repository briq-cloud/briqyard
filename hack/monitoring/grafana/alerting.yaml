# Alerts to Slack (ADR 0054), provisioned by hack/install-monitoring.sh when
# /etc/briqyard-monitoring/alerting.env sets SLACK_WEBHOOK_URL. @LARGEST_SLOT_MB@ is its
# LARGEST_SLOT_MB (16384 by default): the largest size you offer.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: briqyard slack
    receivers:
      - uid: briqyard-slack
        type: slack
        settings:
          url: $SLACK_WEBHOOK_URL
policies:
  - orgId: 1
    receiver: briqyard slack
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
groups:
  - orgId: 1
    name: briqyard
    folder: briqyard
    interval: 1m
    rules:
      - uid: briqyard-not-answering
        title: "Not answering"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: briqyard-prometheus
            model:
              refId: A
              expr: 'up'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ .Labels.instance }} has not answered a scrape for two minutes: the host is down, or the fleet cannot reach it."
      - uid: briqyard-host-condition
        title: "Host condition"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: briqyard-prometheus
            model:
              refId: A
              expr: 'max by (host, condition) (briqyard_host_condition)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Host {{ .Labels.host }} has {{ .Labels.condition }}: the fleet places no new namespace there."
      - uid: briqyard-pool-full
        title: "Pool over 80 %"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: briqyard-prometheus
            model:
              refId: A
              expr: 'max by (host) (briqyard_pool_bytes{kind="used"}) / max by (host) (briqyard_pool_bytes{kind="size"})'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.8] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The pool of host {{ .Labels.host }} is over 80 % used; disk_pressure starts under 10 % free."
      - uid: briqyard-crash-loop
        title: "Machine in a crash loop"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: briqyard-prometheus
            model:
              refId: A
              expr: 'max by (host, namespace, name, machine) (round(increase(briqyard_machine_restarts_total[10m])))'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 0s
        # increase() over ten minutes reads a restart count from about N-1 (the series was first
        # seen after a restart) to 1.2 N: three restarts read 2.0 to 3.6. Rounded, "> 1" fires at
        # two restarts seen or more, so a loop of three never goes unseen; keepFiringFor holds the
        # alert through the readings that cross the threshold (ADR 0094).
        keepFiringFor: 3m
        labels:
          severity: warning
        annotations:
          summary: "Machine {{ .Labels.name }} ({{ .Labels.machine }}) of namespace {{ .Labels.namespace }} on host {{ .Labels.host }} restarted at least twice in ten minutes (a first restart can come before the first sample)."
      - uid: briqyard-backup-failed
        title: "Backup failure observed"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: briqyard-prometheus
            model:
              refId: A
              # Event series start at their first event, not at zero. Keep a first
              # positive observation visible even when increase() has no baseline.
              expr: 'sum by (host) ((briqyard_events_total{reason="backup_failed"} unless briqyard_events_total{reason="backup_failed"} offset 10m) or increase(briqyard_events_total{reason="backup_failed"}[10m]))'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Host {{ .Labels.host }} has an observed backup failure in the ten-minute event window, or a positive counter without a ten-minute baseline."
          description: "Inspect backup events and the store. This bounded event signal does not establish backup success, freshness or an RPO; a cleared alert is not recovery evidence."
      - uid: briqyard-registry-backup-stale
        title: "Registry backup not published"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: briqyard-prometheus
            model:
              refId: A
              # 1 when the last full acknowledgement is over three hours old, or there is none
              # (NaN, as after a restart whose first writes failed); 0 for a fleet without a
              # backup. The fleet writes at least hourly while the store accepts writes.
              expr: '((time() - briqyard_fleet_registry_backup_last_ack_timestamp_seconds > bool 10800) + (briqyard_fleet_registry_backup_last_ack_timestamp_seconds != bool briqyard_fleet_registry_backup_last_ack_timestamp_seconds)) * on(instance, job) briqyard_fleet_registry_backup_configured'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ .Labels.instance }} has not published its registry backup for three hours: no new pool key is handed out and a lost registry is not recoverable."
          description: "The fleet's log has `registry backup` at error with the store's answer; see the runbook's table."
      - uid: briqyard-out-of-room
        title: "Creates refused: no room"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: briqyard-prometheus
            model:
              refId: A
              expr: 'sum by (region, resource) (increase(briqyard_fleet_unschedulable_total{resource=~"memory|cpu|disk"}[5m]))'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Creates in region {{ .Labels.region }} were refused for want of {{ .Labels.resource }}: check capacity and host compatibility."
      - uid: briqyard-host-pressure
        title: "Creates refused: host under pressure"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: briqyard-prometheus
            model:
              refId: A
              expr: 'sum by (region) (increase(briqyard_fleet_unschedulable_total{resource="pressure"}[5m]))'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "A namespace's create in region {{ .Labels.region }} was refused: its host is under a condition. Free that host or move the namespace."
      - uid: briqyard-slots-small
        title: "Largest slot too small"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: briqyard-prometheus
            model:
              refId: A
              expr: 'briqyard_fleet_largest_slot_mb{resource="memory"}'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: ["@LARGEST_SLOT_MB@"] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The largest machine region {{ .Labels.region }} still takes is under @LARGEST_SLOT_MB@ MB of memory."
