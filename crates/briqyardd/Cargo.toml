[package]
name = "briqyardd"
description = "briqyard host daemon: machines in Firecracker microVMs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
briqyard-api = { workspace = true, features = ["tls", "listeners", "host-process"] }
briqyard-objstore = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nix = { workspace = true }
libc = { workspace = true }
futures = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
zstd = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
ring = { workspace = true }
axum = { workspace = true, features = ["ws"] }
http = { workspace = true }
oci-client = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
rcgen = { workspace = true }
axum-server = { workspace = true }
hickory-proto = { workspace = true }
httparse = { workspace = true }

# Image extraction (openat2); the daemon runs on Linux alone.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true }
# The daemon's allocator (ADR 0052).
tikv-jemallocator = { workspace = true }

[dev-dependencies]
briqyard-testing = { workspace = true }
ctor = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
