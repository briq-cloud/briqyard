[package]
name = "briqyard-testing"
description = "What every test binary of the workspace shares: it ends with its parent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Kept opt-in so ordinary test watchdog users do not pull host-service dependencies.
[features]
scoped-native = ["dep:anyhow", "dep:base64", "dep:briqyard-api", "dep:reqwest", "dep:ring", "dep:serde_json", "dep:tokio"]

[dependencies]
anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
briqyard-api = { workspace = true, features = ["execution-admission", "tls"], optional = true }
reqwest = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[[bin]]
name = "scoped-execution-native"
path = "src/scoped_execution_native.rs"
required-features = ["scoped-native"]

[dev-dependencies]
tempfile = "3"
