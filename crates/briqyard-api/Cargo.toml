[package]
name = "briqyard-api"
description = "briqyard's API types and the host–guest protocol"
# Not the workspace version: the init is built from this crate and briqyard-api, and cargo
# hashes a package's version into its symbols, so a release would change the init's bytes
# (ADR 0098). `hack/release.py` leaves it alone; `hack/init-digest-check.sh` keeps it true.
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
rustls = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
nix = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }

[features]
# Child-process inheritance for host supervisors; never enabled by the guest init.
host-process = ["dep:nix"]
# What the daemon, the fleet and the CLI share and the init does not: the pinned verifier and
# the server config (ADR 0020), a pool key's id (ADR 0035).
tls = ["dep:rustls", "dep:sha2", "dep:hex"]
# Listening sockets kept in systemd's fd store (ADR 0051): the daemon and the fleet.
listeners = ["dep:nix", "dep:socket2"]

[dev-dependencies]
briqyard-version = { workspace = true }
briqyard-testing = { workspace = true }
ctor = { workspace = true }
rcgen = { workspace = true }
tempfile = "3"
