[package]
name = "briqyard-init"
description = "PID 1 inside every briqyard machine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
briqyard-api = { workspace = true }
anyhow = { workspace = true }

# The init only runs on Linux; these crates only build there.
[target.'cfg(target_os = "linux")'.dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-vsock = { workspace = true }
nix = { workspace = true }
libc = { workspace = true }
rtnetlink = { workspace = true }
rustix = { workspace = true }
futures = { workspace = true }
tar = { workspace = true }

[dev-dependencies]
briqyard-testing = { workspace = true }
ctor = { workspace = true }

# The tests build config drives and roots in temp directories; Linux only, like the code.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"
