[package]
name = "briqyard-init"
description = "PID 1 inside every briqyard machine"
# Not the workspace version: the init is built from this crate and briqyard-api, and cargo
# hashes a package's version into its symbols, so a release would change the init's bytes
# (ADR 0098). `hack/release.py` leaves it alone; `hack/init-digest-check.sh` keeps it true.
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
briqyard-api = { workspace = true }
anyhow = { workspace = true }

# The init only runs on Linux; these crates only build there.
[target.'cfg(target_os = "linux")'.dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-vsock = { workspace = true }
nix = { workspace = true }
libc = { workspace = true }
rtnetlink = { workspace = true }
netlink-packet-route = "0.19"
rustix = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
futures = { workspace = true }
tar = { workspace = true }

[dev-dependencies]
briqyard-testing = { workspace = true }
ctor = { workspace = true }

# The tests build config drives and roots in temp directories; Linux only, like the code.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"
