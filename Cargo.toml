[workspace]
resolver = "2"
members = [
    "crates/briqyard-api",
    "crates/briqyardd",
    "crates/briqyard-init",
    "crates/briqyard",
    "crates/briqyard-fleet",
    "crates/briqyard-objstore",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/briq-cloud/briqyard"
rust-version = "1.85"

[workspace.dependencies]
briqyard-api = { path = "crates/briqyard-api" }
briqyard-objstore = { path = "crates/briqyard-objstore" }
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde", "clock"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
nix = { version = "0.29", features = ["mount", "reboot", "process", "signal", "user", "fs", "ioctl", "hostname", "net", "socket", "term"] }
libc = "0.2"
rtnetlink = "0.14"
futures = "0.3"
tar = "0.4"
flate2 = "1"
zstd = "0.13"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
age = "0.12"
base64 = "0.22"
bytes = "1"
axum = { version = "0.7", features = ["json", "http1"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
# WebSocket framing for exec sessions (ADR 0029): the client side, over a connection reqwest upgraded.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
tower-http = { version = "0.6", features = ["trace"] }
http = "1"
oci-client = { version = "0.14", default-features = false, features = ["rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
rusty-s3 = "0.7"
url = "2"
tokio-vsock = "0.6"
humantime = "2"
# TLS on the API (ADR 0020): ring, the provider reqwest already uses; no aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
