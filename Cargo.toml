[workspace]
resolver = "2"
members = [
    "crates/briqyard-api",
    "crates/briqyardd",
    "crates/briqyard-init",
    "crates/briqyard",
    "crates/briqyard-fleet",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/briq-cloud/briqyard"
rust-version = "1.85"

[workspace.dependencies]
briqyard-api = { path = "crates/briqyard-api" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde", "clock"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
nix = { version = "0.29", features = ["mount", "reboot", "process", "signal", "user", "fs", "ioctl", "hostname", "net", "socket"] }
libc = "0.2"
rtnetlink = "0.14"
futures = "0.3"
tar = "0.4"
flate2 = "1"
zstd = "0.13"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
bytes = "1"
axum = { version = "0.7", features = ["json", "http1"] }
tower-http = { version = "0.6", features = ["trace"] }
http = "1"
oci-client = { version = "0.14", default-features = false, features = ["rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-vsock = "0.6"
humantime = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
