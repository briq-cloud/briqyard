name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace --exclude briqyard-init
      - run: cargo build --release -p briqyard-init --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Name the binaries as bootstrap-host.sh expects them
        run: |
          mkdir -p dist
          for b in briqyardd briqyard briqyard-fleet; do cp target/release/$b dist/$b-linux-${{ matrix.arch }}; done
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/briqyard-init dist/briqyard-init-linux-${{ matrix.arch }}
          (cd dist && sha256sum * > SHA256SUMS-${{ matrix.arch }})
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "briqyard $GITHUB_REF_NAME. Install with hack/bootstrap-host.sh (BRIQYARD_RELEASE=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME)."
        env:
          GH_TOKEN: ${{ github.token }}
  # The fleet as an image (ADR 0057), from the binaries the build job made: one manifest for
  # amd64 and arm64. The host daemon is not an image.
  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Lay the binaries out as docker/fleet/Dockerfile expects them
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            d=docker/fleet/${pair%%:*}; r=${pair##*:}
            mkdir -p "$d"
            cp "dist/briqyard-fleet-linux-$r" "$d/briqyard-fleet"
            cp "dist/briqyard-linux-$r" "$d/briqyard"
          done
      - name: Tags
        id: tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/briqyard-fleet
          tags="$image:${GITHUB_REF_NAME#v}"
          # A pre-release (v0.2.0-rc1) is never "latest".
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags="$tags,$image:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/fleet
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only
