name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify release metadata before building candidates
        run: |
          python3 -m unittest discover -s hack -p "test_release.py"
          python3 hack/release.py notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
  build:
    needs: notes
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: firecracker-microvm/firecracker
          ref: 95f868c8e345b1cc8faccd1a3c910b4989dc3f58
          path: .validation/firecracker
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install native checked Firecracker prerequisites
        run: sudo apt-get update && sudo apt-get install -y libclang-dev pkg-config cmake libssl-dev libseccomp-dev musl-tools python3-yaml
      - name: Verify release and evidence acceptance checks
        run: |
          python3 -m unittest discover -s hack/firecracker -p "test_*.py"
          python3 -m unittest discover -s hack -p "test_bootstrap.py"
      - name: Prepare exact checked Firecracker sources
        run: python3 hack/firecracker/prepare.py .validation/firecracker
      - name: Validate checked Firecracker regressions once on this architecture
        run: python3 hack/firecracker/validate.py .validation/firecracker "$RUNNER_TEMP/checked-firecracker"
      - name: Build static Firecracker and jailer with production seccomp
        run: python3 hack/firecracker/build_cli.py .validation/firecracker "$RUNNER_TEMP/checked-firecracker" "$RUNNER_TEMP/checked-firecracker-cli" --arch "${{ matrix.arch }}"
      - run: cargo build --release --locked --workspace --exclude briqyard-init
      - run: cargo build --release --locked -p briqyard-init --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Name the binaries as bootstrap-host.sh expects them
        run: |
          mkdir -p dist
          for b in briqyardd briqyard briqyard-fleet; do cp target/release/$b dist/$b-linux-${{ matrix.arch }}; done
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/briqyard-init dist/briqyard-init-linux-${{ matrix.arch }}
          python3 hack/firecracker/package.py .validation/firecracker "$RUNNER_TEMP/checked-firecracker" "$RUNNER_TEMP/checked-firecracker-cli" "dist/firecracker-checked-linux-${{ matrix.arch }}.tar.gz" --arch "${{ matrix.arch }}"
          (cd dist && sha256sum * > SHA256SUMS-${{ matrix.arch }})
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
  # The `nested` runtime class's kernel and ZFS modules (ADR 0088), x86_64 only.
  nested-kernel:
    needs: notes
    uses: ./.github/workflows/nested-kernel.yml
  publish:
    needs: [build, nested-kernel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed changelog entry
        run: python3 hack/release.py notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: nested-kernel-x86_64
          path: dist
      - name: Pin the class files in the x86_64 sums
        run: (cd dist && sha256sum nested-vmlinux-x86_64 nested-modules-x86_64.ext4 nested-versions-x86_64.json >> SHA256SUMS-x86_64)
      - name: Link the corresponding source of the kernel and the modules
        run: |
          jq -r '"\n## Kernel and ZFS source\n\nThe `nested` class kernel is Linux \(.kernel) and its modules are OpenZFS \(.openzfs), built with `hack/kernel/` at this tag.\n\n- \(.linux_source) (SHA-256 `\(.linux_source_sha256)`)\n- \(.openzfs_source) (SHA-256 `\(.openzfs_source_sha256)`)"' \
            dist/nested-versions-x86_64.json >> "$RUNNER_TEMP/release-notes.md"
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --latest=false --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
  # The fleet as an image (ADR 0060), from the binaries the build job made: one manifest for
  # amd64 and arm64. The host daemon is not an image.
  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Lay the binaries out as docker/fleet/Dockerfile expects them
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            d=docker/fleet/${pair%%:*}; r=${pair##*:}
            mkdir -p "$d"
            cp "dist/briqyard-fleet-linux-$r" "$d/briqyard-fleet"
            cp "dist/briqyard-linux-$r" "$d/briqyard"
          done
      - name: Tags
        id: tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/briqyard-fleet
          tags="$image:${GITHUB_REF_NAME#v}"
          # Candidates get a version tag only. Promote this manifest after qualification.
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/fleet
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only
